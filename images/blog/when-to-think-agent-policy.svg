<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">From reasoning scheduler to continuous-time agent policy</title><desc id="desc">The paper schedules wait and visible think updates, while a full agent also needs latent beliefs, endpoint decisions, answer timing, tools, rollback, memory, and safety.</desc><rect width="1200" height="700" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">Reasoning placement is one layer of an agent policy</text><text x="62" y="106" font-size="16" fill="#617083">A production omni agent must schedule cognition, conversation, and external actions together</text><rect x="62" y="158" width="430" height="422" rx="8" fill="#fff" stroke="#60a48d" stroke-width="2"/><text x="88" y="199" font-size="20" font-weight="700" fill="#28785e">This paper learns</text><rect x="88" y="235" width="378" height="68" rx="7" fill="#e8f1f9"/><text x="115" y="264" font-size="15" font-weight="700" fill="#2f6e9f">Full partial-audio prefix</text><text x="115" y="287" font-size="13" fill="#516375">fixed 0.5s decision grid</text><path d="M277 303v28" stroke="#35896f" stroke-width="2"/><g font-size="14" font-weight="700"><rect x="88" y="331" width="168" height="64" rx="6" fill="#eef3f7"/><text x="144" y="369" fill="#415568">WAIT</text><rect x="298" y="331" width="168" height="64" rx="6" fill="#e8f5ef"/><text x="345" y="369" fill="#28785e">THINK</text></g><path d="M277 395v28" stroke="#35896f" stroke-width="2"/><rect x="88" y="423" width="378" height="74" rx="7" fill="#f2eafb"/><text x="115" y="453" font-size="15" font-weight="700" fill="#72509a">Endpoint → final think → answer</text><text x="115" y="478" font-size="13" fill="#665477">answer timing is externally constrained</text><text x="88" y="543" font-size="13" fill="#617083">Objective: place visible reasoning earlier.</text><path d="M492 369h76" stroke="#70869b" stroke-width="3"/><path d="M562 363l12 6-12 6z" fill="#70869b"/><text x="510" y="349" font-size="12" font-weight="700" fill="#516375">EXTEND</text><rect x="574" y="158" width="564" height="422" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="600" y="199" font-size="20" font-weight="700" fill="#203247">A continuous-time Agent Policy needs</text><g font-size="14"><rect x="600" y="232" width="242" height="64" rx="6" fill="#e8f5ef"/><text x="622" y="260" font-weight="700" fill="#28785e">Latent belief updates</text><text x="622" y="282" fill="#41695b">high-frequency, revisable</text><rect x="868" y="232" width="242" height="64" rx="6" fill="#fff1dc"/><text x="890" y="260" font-weight="700" fill="#73532f">Endpoint uncertainty</text><text x="890" y="282" fill="#73532f">pause vs completed turn</text><rect x="600" y="316" width="242" height="64" rx="6" fill="#e8f1f9"/><text x="622" y="344" font-weight="700" fill="#2f6e9f">Learned ANSWER timing</text><text x="622" y="366" fill="#516375">earliest sufficient evidence</text><rect x="868" y="316" width="242" height="64" rx="6" fill="#f2eafb"/><text x="890" y="344" font-weight="700" fill="#72509a">Tools and memory</text><text x="890" y="366" fill="#665477">call, cancel, supersede</text><rect x="600" y="400" width="242" height="64" rx="6" fill="#f7e9e7"/><text x="622" y="428" font-weight="700" fill="#a04a44">Rollback and repair</text><text x="622" y="450" fill="#754d49">new evidence invalidates plan</text><rect x="868" y="400" width="242" height="64" rx="6" fill="#fff1dc"/><text x="890" y="428" font-weight="700" fill="#73532f">Risk and reversibility</text><text x="890" y="450" fill="#73532f">prepare / commit / abort</text></g><rect x="600" y="502" width="510" height="46" rx="6" fill="#eef3f7"/><text x="632" y="531" font-size="13" font-weight="700" fill="#415568">Optimize information gain − compute − commitment − repair cost</text><text x="62" y="642" font-size="14" fill="#617083">The visible behavior may be a pause or interruption; the underlying capability is continuous state and action control.</text></g></svg>
