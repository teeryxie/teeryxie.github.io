<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Accuracy and final-think trade-offs</title><desc id="desc">Synthetic SRQA shows the six-reward controller improving accuracy and shortening final think, while Real Audio Bench has overlapping confidence intervals and different best operating points.</desc><rect width="1200" height="700" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">The learned operating point changes across audio domains</text><text x="62" y="106" font-size="16" fill="#617083">Higher accuracy is better; fewer final-think tokens mean less residual reasoning after the endpoint</text><rect x="62" y="152" width="520" height="448" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="90" y="192" font-size="19" font-weight="700" fill="#203247">Synthetic SRQA · 8,959 items</text><line x1="128" y1="523" x2="530" y2="523" stroke="#8da0b2"/><line x1="128" y1="241" x2="128" y2="523" stroke="#8da0b2"/><text x="276" y="565" font-size="13" fill="#617083">Final-think tokens → shorter</text><text x="81" y="407" transform="rotate(-90 81 407)" font-size="13" fill="#617083">Accuracy</text><g><circle cx="232" cy="407" r="13" fill="#70869b"/><text x="177" y="390" font-size="13" fill="#516375">Base 67.6 / 10.44</text><circle cx="281" cy="453" r="13" fill="#c27d3f"/><text x="226" y="480" font-size="13" fill="#73532f">SFT 66.1 / 9.82</text><circle cx="191" cy="321" r="13" fill="#4b82b1"/><text x="142" y="302" font-size="13" fill="#2f6e9f">DAPO 4</text><circle cx="185" cy="298" r="13" fill="#9b7bbb"/><text x="136" y="279" font-size="13" fill="#72509a">DAPO 5</text><circle cx="350" cy="263" r="17" fill="#35896f"/><text x="304" y="236" font-size="13" font-weight="700" fill="#28785e">DAPO 6</text><text x="304" y="282" font-size="12" fill="#28785e">70.3 / 8.99</text></g><rect x="90" y="582" width="464" height="1" fill="#d5dde4"/><rect x="618" y="152" width="520" height="448" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="646" y="192" font-size="19" font-weight="700" fill="#203247">Real Audio Bench · 186 recordings</text><text x="646" y="219" font-size="13" fill="#617083">Accuracy with 95% bootstrap confidence intervals</text><g font-size="13"><text x="646" y="282" fill="#3e5063">Base</text><line x1="794" y1="277" x2="1028" y2="277" stroke="#70869b" stroke-width="5"/><circle cx="911" cy="277" r="10" fill="#70869b"/><text x="1044" y="282" fill="#516375">64.0</text><text x="646" y="342" fill="#3e5063">SFT</text><line x1="857" y1="337" x2="1080" y2="337" stroke="#35896f" stroke-width="5"/><circle cx="969" cy="337" r="10" fill="#35896f"/><text x="1044" y="322" fill="#28785e">68.8</text><text x="646" y="402" fill="#3e5063">DAPO 5</text><line x1="840" y1="397" x2="1063" y2="397" stroke="#9b7bbb" stroke-width="5"/><circle cx="951" cy="397" r="10" fill="#9b7bbb"/><text x="1044" y="382" fill="#72509a">67.7</text><text x="646" y="462" fill="#3e5063">DAPO 6</text><line x1="810" y1="457" x2="1046" y2="457" stroke="#4b82b1" stroke-width="5"/><circle cx="928" cy="457" r="10" fill="#4b82b1"/><text x="1044" y="442" fill="#2f6e9f">65.1</text></g><rect x="646" y="505" width="464" height="63" rx="6" fill="#fff1dc"/><text x="670" y="532" font-size="13" font-weight="700" fill="#73532f">Intervals overlap substantially.</text><text x="670" y="555" font-size="12" fill="#73532f">Transfer is supported; fine-grained ranking is not.</text><text x="62" y="654" font-size="13" fill="#617083">The synthetic result is the main controlled claim. On real audio, best accuracy (SFT) and shortest final think (DAPO 6) come from different variants.</text></g></svg>
