<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">From latent response state to continuous-time agent policy</title><desc id="desc">FLAIR bridges streaming audio and response generation, while a product agent additionally needs uncertainty, tool, memory, playback, safety, and rollback state.</desc><rect width="1200" height="720" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">Latent thought is a bridge, not the complete agent state</text><text x="62" y="106" font-size="16" fill="#617083">Natural interruption is a visible behavior; state revision and action control are the underlying capability</text>
  <rect x="62" y="156" width="430" height="446" rx="8" fill="#fff" stroke="#60a48d" stroke-width="2"/><text x="88" y="198" font-size="20" font-weight="700" fill="#28785e">What FLAIR models</text><rect x="88" y="236" width="378" height="70" rx="7" fill="#e8f1f9"/><text x="116" y="265" font-size="15" font-weight="700" fill="#2f6e9f">Streaming user speech X≤t</text><text x="116" y="289" font-size="13" fill="#617083">causal acoustic and semantic evidence</text><path d="M277 306v36" stroke="#35896f" stroke-width="2"/><rect x="88" y="342" width="378" height="92" rx="7" fill="#e8f5ef"/><text x="116" y="375" font-size="15" font-weight="700" fill="#28785e">Recurrent latent embedding Z<tspan baseline-shift="sub" font-size="11">t</tspan></text><text x="116" y="401" font-size="13" fill="#41695b">soft vocabulary state updated per frame</text><path d="M277 434v36" stroke="#35896f" stroke-width="2"/><rect x="88" y="470" width="378" height="70" rx="7" fill="#f2eafb"/><text x="116" y="499" font-size="15" font-weight="700" fill="#72509a">Language and speech response</text><text x="116" y="523" font-size="13" fill="#617083">listen / speak timing + generated content</text><text x="88" y="574" font-size="13" fill="#617083">Goal: improve the next conversational response.</text>
  <path d="M492 379h82" stroke="#70869b" stroke-width="3"/><path d="M568 373l12 6-12 6z" fill="#70869b"/><text x="508" y="360" font-size="12" font-weight="700" fill="#516375">EXTEND</text>
  <rect x="580" y="156" width="558" height="446" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="606" y="198" font-size="20" font-weight="700" fill="#203247">What a continuous-time Agent Policy still needs</text><g font-size="14"><rect x="606" y="232" width="242" height="66" rx="6" fill="#fff1dc"/><text x="628" y="259" font-weight="700" fill="#73532f">Belief + uncertainty</text><text x="628" y="282" fill="#73532f">multiple hypotheses, readiness</text><rect x="870" y="232" width="242" height="66" rx="6" fill="#e8f1f9"/><text x="892" y="259" font-weight="700" fill="#2f6e9f">Tool execution state</text><text x="892" y="282" fill="#516375">pending, result, cancel, retry</text><rect x="606" y="318" width="242" height="66" rx="6" fill="#f2eafb"/><text x="628" y="345" font-weight="700" fill="#72509a">Memory + provenance</text><text x="628" y="368" fill="#665477">version, source, supersession</text><rect x="870" y="318" width="242" height="66" rx="6" fill="#e8f5ef"/><text x="892" y="345" font-weight="700" fill="#28785e">Playback awareness</text><text x="892" y="368" fill="#41695b">generated, buffered, heard</text><rect x="606" y="404" width="242" height="66" rx="6" fill="#f7e9e7"/><text x="628" y="431" font-weight="700" fill="#a04a44">Rollback + repair</text><text x="628" y="454" fill="#754d49">invalidate plan and action</text><rect x="870" y="404" width="242" height="66" rx="6" fill="#fff1dc"/><text x="892" y="431" font-weight="700" fill="#73532f">Risk + reversibility</text><text x="892" y="454" fill="#73532f">prepare, confirm, commit</text></g><rect x="606" y="502" width="506" height="58" rx="7" fill="#eef3f7"/><text x="642" y="537" font-size="14" font-weight="700" fill="#415568">WAIT · CLARIFY · SPEAK · ACT · ABORT · MEMORY_WRITE</text>
  <text x="62" y="660" font-size="14" fill="#617083">Research target: a state that is useful for action, revisable by new evidence, and auditable at product-critical boundaries.</text></g>
</svg>
