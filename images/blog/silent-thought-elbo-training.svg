<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Global-aware Expert training and causal inference</title><desc id="desc">A non-causal expert sees the complete dialogue to generate posterior latent targets, while a causal student learns reconstruction, KL, and timing losses.</desc><rect width="1200" height="720" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">Training with hindsight, deploying causally</text><text x="62" y="106" font-size="16" fill="#617083">The Expert supplies an approximate posterior only during training</text>
  <rect x="62" y="152" width="490" height="424" rx="8" fill="#fff" stroke="#9b7bbb" stroke-width="2"/><text x="88" y="193" font-size="19" font-weight="700" fill="#72509a">Global-aware Expert Qφ · TRAIN ONLY</text><rect x="88" y="226" width="190" height="64" rx="6" fill="#e8f1f9"/><text x="118" y="254" font-size="14" font-weight="700" fill="#2f6e9f">Complete user audio X</text><text x="116" y="276" font-size="12" fill="#617083">past + future frames</text><rect x="310" y="226" width="214" height="64" rx="6" fill="#f2eafb"/><text x="338" y="254" font-size="14" font-weight="700" fill="#72509a">Future assistant reply Y</text><text x="355" y="276" font-size="12" fill="#617083">ground-truth tokens</text><path d="M278 258h32" stroke="#70869b" stroke-width="2"/><rect x="132" y="334" width="350" height="72" rx="7" fill="#f2eafb" stroke="#9b7bbb"/><text x="199" y="365" font-size="15" font-weight="700" fill="#72509a">Non-causal encoder</text><text x="181" y="389" font-size="13" fill="#665477">full-session representation</text><path d="M307 290v44M307 406v43" stroke="#9b7bbb" stroke-width="2"/><rect x="132" y="449" width="350" height="72" rx="7" fill="#f2eafb"/><text x="176" y="479" font-size="15" font-weight="700" fill="#72509a">Posterior distribution W<tspan baseline-shift="sub" font-size="11">expert</tspan></text><text x="178" y="504" font-size="13" fill="#665477">Softmax → vocabulary embedding Z</text>
  <rect x="648" y="152" width="490" height="424" rx="8" fill="#fff" stroke="#60a48d" stroke-width="2"/><text x="674" y="193" font-size="19" font-weight="700" fill="#28785e">Causal full-duplex Student Pθ</text><rect x="674" y="226" width="438" height="64" rx="6" fill="#e8f1f9"/><text x="761" y="254" font-size="14" font-weight="700" fill="#2f6e9f">Observed audio prefix X≤t</text><text x="796" y="276" font-size="12" fill="#617083">no future information</text><path d="M893 290v44" stroke="#35896f" stroke-width="2"/><rect x="718" y="334" width="350" height="72" rx="7" fill="#e8f5ef" stroke="#60a48d"/><text x="801" y="365" font-size="15" font-weight="700" fill="#28785e">Streaming LLM</text><text x="769" y="389" font-size="13" fill="#41695b">prior W<tspan baseline-shift="sub" font-size="10">student</tspan> + timing G<tspan baseline-shift="sub" font-size="10">t</tspan></text><path d="M893 406v43" stroke="#35896f" stroke-width="2"/><rect x="718" y="449" width="350" height="72" rx="7" fill="#e8f5ef"/><text x="760" y="479" font-size="15" font-weight="700" fill="#28785e">Latent state or reply token</text><text x="766" y="504" font-size="13" fill="#41695b">selected by the learned timing gate</text>
  <path d="M482 485C565 485 592 388 718 370" fill="none" stroke="#9b7bbb" stroke-width="3" stroke-dasharray="8 6"/><rect x="519" y="411" width="155" height="46" rx="6" fill="#fff" stroke="#9b7bbb"/><text x="540" y="439" font-size="13" font-weight="700" fill="#72509a">KL alignment</text>
  <g font-size="14"><rect x="62" y="616" width="330" height="60" rx="7" fill="#e8f5ef"/><text x="126" y="652" font-weight="700" fill="#28785e">L_reco · response quality</text><rect x="435" y="616" width="330" height="60" rx="7" fill="#f2eafb"/><text x="494" y="652" font-weight="700" fill="#72509a">L_regu · posterior → prior</text><rect x="808" y="616" width="330" height="60" rx="7" fill="#fff1dc"/><text x="876" y="652" font-weight="700" fill="#73532f">L_time · listen / speak</text></g><text x="650" y="600" font-size="12" fill="#617083">INFERENCE: remove the entire purple branch</text></g>
</svg>
