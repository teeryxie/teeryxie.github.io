<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Six dimensions of natural interaction</title><desc id="d">Perception, temporality, interaction, cognition, action and governance form a natural interaction system.</desc><rect width="1200" height="660" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="64" y="66" font-size="28" font-weight="700" fill="#172033">Natural interaction is a system property</text><text x="64" y="99" font-size="16" fill="#667085">Six orthogonal dimensions must be composed around shared state and timing.</text><circle cx="600" cy="355" r="112" fill="#fff" stroke="#172033" stroke-width="3"/><text x="600" y="342" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">Shared timeline</text><text x="600" y="374" text-anchor="middle" font-size="17" fill="#344054">world + interaction state</text><g font-size="18" font-weight="700"><rect x="70" y="165" width="250" height="104" rx="8" fill="#eaf2ff" stroke="#4c7ee8" stroke-width="2"/><text x="98" y="207" fill="#2457b8">PERCEPTION</text><text x="98" y="239" font-size="14" font-weight="400" fill="#344054">audio · video · screen · gesture</text><rect x="475" y="135" width="250" height="90" rx="8" fill="#eaf2ff" stroke="#4c7ee8" stroke-width="2"/><text x="503" y="174" fill="#2457b8">TEMPORALITY</text><text x="503" y="201" font-size="14" font-weight="400" fill="#344054">streaming · duplex · barge-in</text><rect x="880" y="165" width="250" height="104" rx="8" fill="#eef8f2" stroke="#46a477" stroke-width="2"/><text x="908" y="207" fill="#24734d">INTERACTION</text><text x="908" y="239" font-size="14" font-weight="400" fill="#344054">wait · speak · yield · repair</text><rect x="70" y="445" width="250" height="104" rx="8" fill="#f3efff" stroke="#8062c7" stroke-width="2"/><text x="98" y="487" fill="#6647ae">COGNITION</text><text x="98" y="519" font-size="14" font-weight="400" fill="#344054">reason · belief · plan</text><rect x="475" y="485" width="250" height="90" rx="8" fill="#f3efff" stroke="#8062c7" stroke-width="2"/><text x="503" y="524" fill="#6647ae">ACTION</text><text x="503" y="551" font-size="14" font-weight="400" fill="#344054">tools · workflow · execution</text><rect x="880" y="445" width="250" height="104" rx="8" fill="#fff1f0" stroke="#e05d5d" stroke-width="2"/><text x="908" y="487" fill="#b42318">GOVERNANCE</text><text x="908" y="519" font-size="14" font-weight="400" fill="#344054">confirm · rollback · audit</text></g><g stroke="#98a2b3" stroke-width="2"><path d="M320 235L505 302"/><path d="M600 225V243"/><path d="M880 235L695 302"/><path d="M320 480L505 408"/><path d="M600 467V485"/><path d="M880 480L695 408"/></g><text x="64" y="620" font-size="15" fill="#667085">Omni mainly expands perception. Duplex enables concurrent timing. Agentic connects action. None is sufficient alone.</text></g></svg>
