<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">From ToM labels to online trajectories</title><desc id="desc">Comparison between snapshot labels, one-step process gold and online revisable mental belief trajectories.</desc><rect width="1200" height="680" fill="#f4f7fa"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">From a label to a revisable belief trajectory</text><text x="62" y="106" font-family="Arial,sans-serif" font-size="16" fill="#617083">Three supervision targets answer different research questions</text>
  <g font-family="Arial,sans-serif"><rect x="62" y="158" width="326" height="440" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="437" y="158" width="326" height="440" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="812" y="158" width="326" height="440" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="62" y="158" width="326" height="10" rx="5" fill="#497eac"/><rect x="437" y="158" width="326" height="10" rx="5" fill="#c27d3f"/><rect x="812" y="158" width="326" height="10" rx="5" fill="#35896f"/>
    <text x="88" y="208" font-size="20" font-weight="700" fill="#203247">MeetingToM snapshot</text><text x="88" y="238" font-size="14" fill="#617083">What state dominates this window?</text><line x1="96" y1="302" x2="350" y2="302" stroke="#a5b4c3" stroke-width="4"/><rect x="160" y="280" width="128" height="44" rx="6" fill="#e8f1f9"/><text x="179" y="307" font-size="14" font-weight="700" fill="#2f6e9f">Cognitive Conflict</text><g font-size="14" fill="#516375"><text x="88" y="378">+ natural meeting evidence</text><text x="88" y="408">+ clear classification protocol</text><text x="88" y="452">− dominant label flattens change</text><text x="88" y="482">− observer judgment ≠ private truth</text><text x="88" y="526">Output: class / participant ID</text></g>
    <text x="463" y="208" font-size="20" font-weight="700" fill="#203247">MWM process gold</text><text x="463" y="238" font-size="14" fill="#617083">What follows from each action?</text><g fill="#fff1dc" stroke="#d8b88e"><rect x="463" y="278" width="72" height="44" rx="6"/><rect x="563" y="278" width="72" height="44" rx="6"/><rect x="663" y="278" width="72" height="44" rx="6"/></g><g font-size="12" font-weight="700" fill="#8a5a28"><text x="483" y="305">State</text><text x="583" y="305">Action</text><text x="677" y="305">Next state</text></g><path d="M535 300h28M635 300h28" stroke="#a27a4c" stroke-width="2"/><g font-size="14" fill="#516375"><text x="463" y="378">+ target-specific observation</text><text x="463" y="408">+ option-level successor states</text><text x="463" y="452">− manually constructed scenarios</text><text x="463" y="482">− one decision step</text><text x="463" y="526">Output: inspectable process artifacts</text></g>
    <text x="838" y="208" font-size="20" font-weight="700" fill="#203247">Online Omni belief</text><text x="838" y="238" font-size="14" fill="#617083">What should change now?</text><path d="M844 318C900 262 950 352 1000 286s88 34 112-4" fill="none" stroke="#35896f" stroke-width="5"/><circle cx="844" cy="318" r="6" fill="#35896f"/><circle cx="1000" cy="286" r="6" fill="#35896f"/><circle cx="1112" cy="282" r="6" fill="#35896f"/><g font-size="14" fill="#516375"><text x="838" y="378">time + target + provenance</text><text x="838" y="408">confidence + alternatives</text><text x="838" y="438">valid interval + supersession</text><text x="838" y="468">action + user reaction</text><text x="838" y="512" font-weight="700" fill="#28785e">Goal: uncertainty-aware policy</text><text x="838" y="542">not a claim of mind reading</text></g>
  </g>
</svg>
