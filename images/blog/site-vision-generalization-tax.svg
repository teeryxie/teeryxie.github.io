<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Generalization tax versus site-specific vision</title><desc id="desc">A general model handles many layouts and conditions, while a site specialist is constrained to one camera, region and task.</desc><rect width="1200" height="690" fill="#f4f7fa"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">From generalization tax to a site contract</text><text x="62" y="106" font-family="Arial,sans-serif" font-size="16" fill="#617083">The model becomes smaller because the promised world becomes smaller</text>
  <g font-family="Arial,sans-serif"><rect x="62" y="154" width="500" height="454" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="638" y="154" width="500" height="454" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="62" y="154" width="500" height="11" rx="5" fill="#b65f55"/><rect x="638" y="154" width="500" height="11" rx="5" fill="#36866d"/><text x="92" y="210" font-size="22" font-weight="700" fill="#203247">One model for every garage</text><text x="668" y="210" font-size="22" font-weight="700" fill="#203247">One model for this camera</text>
    <g font-size="14" fill="#4b5d70"><rect x="92" y="246" width="134" height="54" rx="6" fill="#f7e9e7"/><text x="120" y="278">many layouts</text><rect x="244" y="246" width="134" height="54" rx="6" fill="#f7e9e7"/><text x="270" y="278">many cameras</text><rect x="396" y="246" width="134" height="54" rx="6" fill="#f7e9e7"/><text x="422" y="278">many doors</text><rect x="92" y="320" width="134" height="54" rx="6" fill="#f7e9e7"/><text x="116" y="352">weather + night</text><rect x="244" y="320" width="134" height="54" rx="6" fill="#f7e9e7"/><text x="267" y="352">occlusions</text><rect x="396" y="320" width="134" height="54" rx="6" fill="#f7e9e7"/><text x="421" y="352">open world</text></g>
    <text x="92" y="428" font-size="15" font-weight="700" fill="#a34f42">High generalization tax</text><text x="92" y="458" font-size="14" fill="#617083">large model · broad data · expensive inference</text><text x="92" y="486" font-size="14" fill="#617083">hard to specify every edge case</text><path d="M318 526h-148" stroke="#b65f55" stroke-width="8"/><text x="334" y="532" font-size="14" fill="#617083">deployment scope</text>
    <g font-size="14" fill="#3f5766"><rect x="668" y="246" width="200" height="56" rx="6" fill="#e7f3ee"/><text x="715" y="279">camera_id = 17</text><rect x="888" y="246" width="220" height="56" rx="6" fill="#e7f3ee"/><text x="932" y="279">ROI = garage door</text><rect x="668" y="322" width="200" height="56" rx="6" fill="#e7f3ee"/><text x="715" y="355">task = open / closed</text><rect x="888" y="322" width="220" height="56" rx="6" fill="#e7f3ee"/><text x="929" y="355">action = alert owner</text></g><text x="668" y="428" font-size="15" font-weight="700" fill="#28785e">Site-specific envelope</text><text x="668" y="458" font-size="14" fill="#617083">small model · fixed geometry · edge inference</text><text x="668" y="486" font-size="14" fill="#617083">future time, lighting and drift still require tests</text><path d="M668 526h148" stroke="#36866d" stroke-width="8"/><text x="832" y="532" font-size="14" fill="#617083">deployment scope</text>
    <path d="M562 380h76" stroke="#788b9d" stroke-width="2" stroke-dasharray="7 6"/><path d="M634 375l8 5-8 5z" fill="#788b9d"/><text x="574" y="358" font-size="12" fill="#617083">constrain</text>
  </g>
</svg>
