<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Three levels of duplex interaction</title><desc id="d">I O duplex, behavioral duplex and semantic duplex progressively add stronger interaction capabilities.</desc><rect width="1200" height="660" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="64" y="66" font-size="28" font-weight="700" fill="#172033">Full duplex is not one binary capability</text><text x="64" y="99" font-size="16" fill="#667085">Choose the weakest level that satisfies the task contract.</text><rect x="70" y="166" width="300" height="340" rx="8" fill="#eaf2ff" stroke="#4c7ee8" stroke-width="2"/><text x="98" y="210" font-size="22" font-weight="700" fill="#2457b8">LEVEL 1 · I/O</text><text x="98" y="249" font-size="16" fill="#344054">Input remains open during output</text><text x="98" y="286" font-size="15" fill="#667085">• streaming transport</text><text x="98" y="318" font-size="15" fill="#667085">• echo cancellation</text><text x="98" y="350" font-size="15" fill="#667085">• interruptible playback</text><text x="98" y="432" font-size="14" fill="#2457b8">No native duplex model required</text><rect x="450" y="146" width="300" height="380" rx="8" fill="#eef8f2" stroke="#46a477" stroke-width="2"/><text x="478" y="190" font-size="22" font-weight="700" fill="#24734d">LEVEL 2 · BEHAVIOR</text><text x="478" y="229" font-size="16" fill="#344054">Policy decides conversational action</text><text x="478" y="266" font-size="15" fill="#667085">• wait / backchannel</text><text x="478" y="298" font-size="15" fill="#667085">• speak / yield / ignore</text><text x="478" y="330" font-size="15" fill="#667085">• keep writing while listening</text><text x="478" y="452" font-size="14" fill="#24734d">Interaction controller required</text><rect x="830" y="126" width="300" height="420" rx="8" fill="#f3efff" stroke="#8062c7" stroke-width="2"/><text x="858" y="170" font-size="22" font-weight="700" fill="#6647ae">LEVEL 3 · SEMANTIC</text><text x="858" y="209" font-size="16" fill="#344054">New evidence updates current plan</text><text x="858" y="246" font-size="15" fill="#667085">• understand corrections</text><text x="858" y="278" font-size="15" fill="#667085">• revise pending speech</text><text x="858" y="310" font-size="15" fill="#667085">• cancel tools and board state</text><text x="858" y="342" font-size="15" fill="#667085">• preserve valid context</text><text x="858" y="472" font-size="14" fill="#6647ae">Online shared-state update required</text><path d="M370 336H434" stroke="#98a2b3" stroke-width="2"/><path d="M750 336H814" stroke="#98a2b3" stroke-width="2"/><text x="600" y="606" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Natural products usually need selective overlap, not two endless simultaneous monologues.</text></g></svg>
