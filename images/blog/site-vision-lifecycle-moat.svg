<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Site-specific model lifecycle and moat</title><desc id="desc">A specialist model moves through calibration, shadow mode, acceptance, active monitoring, drift detection and rollback.</desc><rect width="1200" height="700" fill="#f4f7fa"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">The moat is the maintained lifecycle</text><text x="62" y="106" font-family="Arial,sans-serif" font-size="16" fill="#617083">Weights are replaceable; reliable activation, monitoring and recovery are not</text>
  <g font-family="Arial,sans-serif"><circle cx="600" cy="366" r="132" fill="#fff" stroke="#b9c8d8" stroke-width="2"/><text x="526" y="342" font-size="20" font-weight="700" fill="#203247">Site specialist</text><text x="520" y="374" font-size="14" fill="#617083">camera + ROI + task</text><text x="516" y="402" font-size="14" fill="#617083">weights + threshold + rule</text>
    <g><rect x="92" y="174" width="196" height="92" rx="8" fill="#e8f1f9"/><text x="126" y="210" font-size="16" font-weight="700" fill="#2f6e9f">1. Calibrate</text><text x="126" y="238" font-size="13" fill="#506275">history + site envelope</text><rect x="92" y="470" width="196" height="92" rx="8" fill="#f2eafb"/><text x="126" y="506" font-size="16" font-weight="700" fill="#765196">6. Retrain / rollback</text><text x="126" y="534" font-size="13" fill="#506275">versioned, reversible</text><rect x="912" y="174" width="196" height="92" rx="8" fill="#fff1dc"/><text x="946" y="210" font-size="16" font-weight="700" fill="#8f5d28">2. Shadow</text><text x="946" y="238" font-size="13" fill="#506275">no business action</text><rect x="912" y="470" width="196" height="92" rx="8" fill="#f7e9e7"/><text x="946" y="506" font-size="16" font-weight="700" fill="#a34f42">5. Detect drift</text><text x="946" y="534" font-size="13" fill="#506275">camera + data + errors</text><rect x="502" y="142" width="196" height="76" rx="8" fill="#e8f5ef"/><text x="540" y="176" font-size="16" font-weight="700" fill="#28785e">3. Accept</text><text x="531" y="202" font-size="13" fill="#506275">event-level contract</text><rect x="502" y="534" width="196" height="76" rx="8" fill="#e8f5ef"/><text x="538" y="568" font-size="16" font-weight="700" fill="#28785e">4. Operate</text><text x="528" y="594" font-size="13" fill="#506275">alert → action → feedback</text></g>
    <g fill="none" stroke="#70869b" stroke-width="2"><path d="M288 210C382 154 426 160 502 174"/><path d="M698 174c76-14 120-8 214 36"/><path d="M1010 266v204"/><path d="M912 516c-94 56-138 62-214 70"/><path d="M502 586c-76-8-120-14-214-70"/><path d="M190 470V266"/></g><g fill="#70869b"><path d="M498 169l8 6-9 4z"/><path d="M908 205l8 7-10 2z"/><path d="M1005 466l5 8 5-8z"/><path d="M702 581l-8 6 9 4z"/><path d="M292 511l-8 7 10 2z"/><path d="M185 270l5-8 5 8z"/></g>
    <rect x="322" y="640" width="556" height="38" rx="6" fill="#263b50"/><text x="366" y="665" font-size="14" font-weight="700" fill="#fff">Accumulated asset: task schemas · drift data · integrations · trust</text>
  </g>
</svg>
