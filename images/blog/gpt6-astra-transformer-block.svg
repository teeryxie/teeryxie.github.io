<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">一个 Transformer block 内部的状态更新</title>
  <desc id="desc">残差流依次经过归一化、注意力、残差加法、归一化、前馈网络和第二次残差加法。</desc>
  <rect width="1200" height="700" fill="#f7f8fa"/>
  <text x="70" y="72" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#17232f">Inside one Transformer block</text>
  <text x="70" y="108" font-family="Inter,Arial,sans-serif" font-size="16" fill="#586674">Two updates, one continuous residual stream</text>
  <path d="M120 582 V148 H1060 V582" fill="none" stroke="#aab5be" stroke-width="8" stroke-linecap="round"/>
  <text x="76" y="626" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17232f">xₗ</text>
  <text x="1032" y="626" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#17232f">xₗ₊₁</text>
  <rect x="190" y="220" width="170" height="78" rx="6" fill="#ffffff" stroke="#7b8792" stroke-width="2"/>
  <text x="275" y="252" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#17232f">Normalization</text>
  <text x="275" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#687785">stabilize scale</text>
  <rect x="416" y="202" width="210" height="114" rx="6" fill="#e5f1ed" stroke="#28745d" stroke-width="3"/>
  <text x="521" y="246" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#145440">Attention</text>
  <text x="521" y="276" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#3f6258">read and route context</text>
  <circle cx="690" cy="259" r="31" fill="#ffffff" stroke="#28745d" stroke-width="3"/>
  <text x="690" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#145440">+</text>
  <rect x="750" y="220" width="170" height="78" rx="6" fill="#ffffff" stroke="#7b8792" stroke-width="2"/>
  <text x="835" y="252" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#17232f">Normalization</text>
  <text x="835" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#687785">stabilize scale</text>
  <path d="M120 520 H190 M360 259 H416 M626 259 H659 M721 259 H750" fill="none" stroke="#53616d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M120 520 C120 362 580 356 668 282" fill="none" stroke="#d19b2a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#goldArrow)"/>
  <rect x="750" y="392" width="210" height="114" rx="6" fill="#f9ead1" stroke="#b87918" stroke-width="3"/>
  <text x="855" y="436" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#7a4b06">FFN</text>
  <text x="855" y="466" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#755a30">transform local state</text>
  <circle cx="1030" cy="449" r="31" fill="#ffffff" stroke="#b87918" stroke-width="3"/>
  <text x="1030" y="458" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#7a4b06">+</text>
  <path d="M835 298 V392 M960 449 H999 M1061 449 V520" fill="none" stroke="#53616d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M690 290 C690 542 930 550 1008 472" fill="none" stroke="#d19b2a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#goldArrow)"/>
  <text x="328" y="392" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#a56d10">Residual path preserves prior state</text>
  <rect x="180" y="650" width="18" height="6" fill="#28745d"/><text x="210" y="660" font-family="Inter,Arial,sans-serif" font-size="14" fill="#586674">cross-position information</text>
  <rect x="450" y="650" width="18" height="6" fill="#b87918"/><text x="480" y="660" font-family="Inter,Arial,sans-serif" font-size="14" fill="#586674">per-position transformation</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#53616d"/></marker>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d19b2a"/></marker>
  </defs>
</svg>
