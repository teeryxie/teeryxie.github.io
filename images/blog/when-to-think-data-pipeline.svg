<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Wait-think-answer trace construction</title><desc id="desc">GPT-4o generates semantic records and lexical anchors, Qwen3-TTS renders full utterances, forced alignment maps words to time, and actions snap to a half-second grid.</desc><rect width="1200" height="690" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">From semantic anchors to audio-grounded controller traces</text><text x="62" y="106" font-size="16" fill="#617083">The policy hears audio only, but its timing supervision originates from text anchors and forced alignment</text><g transform="translate(62 164)"><rect width="204" height="330" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="24" y="42" font-size="17" font-weight="700" fill="#203247">1. Teacher record</text><text x="24" y="76" font-size="13" fill="#516375">spoken surface form</text><text x="24" y="104" font-size="13" fill="#516375">TTS style instruction</text><text x="24" y="132" font-size="13" fill="#516375">lexical anchors</text><text x="24" y="160" font-size="13" fill="#516375">logical actions</text><text x="24" y="188" font-size="13" fill="#516375">final answer</text><rect x="24" y="226" width="156" height="66" rx="6" fill="#f2eafb"/><text x="47" y="254" font-size="13" font-weight="700" fill="#72509a">GPT-4o</text><text x="47" y="276" font-size="12" fill="#665477">80K candidates</text></g><path d="M266 329h44" stroke="#70869b" stroke-width="2"/><path d="M304 323l12 6-12 6z" fill="#70869b"/><g transform="translate(316 164)"><rect width="204" height="330" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="24" y="42" font-size="17" font-weight="700" fill="#203247">2. Full utterance</text><path d="M24 112l14-13 14 27 14-42 14 37 14-21 14 8 14-28 14 45 14-32 14 20 14-11" fill="none" stroke="#3d79a8" stroke-width="2"/><text x="24" y="155" font-size="13" fill="#516375">Qwen3-TTS renders once</text><text x="24" y="181" font-size="13" fill="#516375">No per-action synthesis</text><rect x="24" y="226" width="156" height="66" rx="6" fill="#e8f1f9"/><text x="47" y="254" font-size="13" font-weight="700" fill="#2f6e9f">Natural prosody</text><text x="47" y="276" font-size="12" fill="#516375">no boundary leakage</text></g><path d="M520 329h44" stroke="#70869b" stroke-width="2"/><path d="M558 323l12 6-12 6z" fill="#70869b"/><g transform="translate(570 164)"><rect width="248" height="330" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="24" y="42" font-size="17" font-weight="700" fill="#203247">3. Forced alignment</text><text x="24" y="82" font-size="13" fill="#516375">word → timestamp</text><g font-size="12"><rect x="24" y="111" width="51" height="38" rx="4" fill="#eef3f7"/><text x="34" y="135" fill="#415568">12 books</text><rect x="83" y="111" width="58" height="38" rx="4" fill="#e8f5ef"/><text x="96" y="135" fill="#28785e">gave 4</text><rect x="149" y="111" width="72" height="38" rx="4" fill="#e8f5ef"/><text x="158" y="135" fill="#28785e">half left</text></g><text x="24" y="192" font-size="13" fill="#516375">Anchors locate answer-relevant</text><text x="24" y="216" font-size="13" fill="#516375">semantic state changes.</text><rect x="24" y="246" width="200" height="46" rx="6" fill="#fff1dc"/><text x="45" y="274" font-size="13" font-weight="700" fill="#73532f">Text-derived timing target</text></g><path d="M818 329h44" stroke="#70869b" stroke-width="2"/><path d="M856 323l12 6-12 6z" fill="#70869b"/><g transform="translate(868 164)"><rect width="270" height="330" rx="8" fill="#fff" stroke="#60a48d" stroke-width="2"/><text x="24" y="42" font-size="17" font-weight="700" fill="#28785e">4. 0.5s action grid</text><g font-size="11" font-weight="700"><rect x="24" y="93" width="54" height="44" rx="4" fill="#eef3f7"/><text x="34" y="120" fill="#415568">WAIT</text><rect x="85" y="93" width="72" height="44" rx="4" fill="#e8f5ef"/><text x="98" y="120" fill="#28785e">THINK</text><rect x="164" y="93" width="54" height="44" rx="4" fill="#eef3f7"/><text x="174" y="120" fill="#415568">WAIT</text><rect x="24" y="151" width="72" height="44" rx="4" fill="#e8f5ef"/><text x="37" y="178" fill="#28785e">THINK</text><rect x="103" y="151" width="54" height="44" rx="4" fill="#eef3f7"/><text x="113" y="178" fill="#415568">WAIT</text><rect x="164" y="151" width="72" height="44" rx="4" fill="#e8f5ef"/><text x="177" y="178" fill="#28785e">THINK</text></g><text x="24" y="238" font-size="13" fill="#41695b">Snap anchor upward to grid</text><text x="24" y="264" font-size="13" fill="#41695b">Train: 73,675 · Val: 2,048</text><text x="24" y="290" font-size="13" fill="#41695b">DAPO scorable: 37,180</text></g><rect x="62" y="548" width="1076" height="72" rx="7" fill="#fff" stroke="#b9c8d8"/><text x="88" y="578" font-size="14" font-weight="700" fill="#203247">What the controller learns</text><text x="88" y="604" font-size="13" fill="#516375">Audio-only policy behavior aligned to a teacher-defined notion of “answer-relevant update”, not a naturally observed human cognition trace.</text></g></svg>
