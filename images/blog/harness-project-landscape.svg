<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Open-source agent harness landscape</title>
  <desc id="desc">OpenHands, mini-SWE-agent, Aider, and Goose positioned by autonomy and scope.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="60" y="66" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Four projects, four different Harness products</text>
  <text x="60" y="98" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="16">They are representative routes, not a single leaderboard.</text>
  <g font-family="Inter, Arial, sans-serif">
    <line x1="160" y1="552" x2="1090" y2="552" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="160" y1="552" x2="160" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="160" y="590" fill="#475569" font-size="14">Code-focused</text>
    <text x="990" y="590" fill="#475569" font-size="14">General tools</text>
    <text x="550" y="624" fill="#334155" font-size="14" font-weight="700">TASK SCOPE</text>
    <text x="46" y="538" fill="#475569" font-size="14">Human-led</text>
    <text x="34" y="172" fill="#475569" font-size="14">Always-on</text>
    <text transform="translate(78 405) rotate(-90)" fill="#334155" font-size="14" font-weight="700">AUTONOMY / ORCHESTRATION</text>

    <line x1="160" y1="348" x2="1090" y2="348" stroke="#e2e8f0" stroke-dasharray="6 6"/>
    <line x1="625" y1="144" x2="625" y2="552" stroke="#e2e8f0" stroke-dasharray="6 6"/>

    <rect x="230" y="403" width="250" height="112" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="254" y="437" fill="#1d4ed8" font-size="22" font-weight="700">Aider</text>
    <text x="254" y="465" fill="#0f172a" font-size="15" font-weight="600">Git-native pair programming</text>
    <text x="254" y="489" fill="#64748b" font-size="13">repo map / commit / lint-test / undo</text>

    <rect x="258" y="220" width="274" height="112" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="282" y="254" fill="#6d28d9" font-size="22" font-weight="700">mini-SWE-agent</text>
    <text x="282" y="282" fill="#0f172a" font-size="15" font-weight="600">Minimal research loop</text>
    <text x="282" y="306" fill="#64748b" font-size="13">trajectory / limits / benchmark</text>

    <rect x="730" y="373" width="250" height="112" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="754" y="407" fill="#047857" font-size="22" font-weight="700">Goose</text>
    <text x="754" y="435" fill="#0f172a" font-size="15" font-weight="600">Extensible local agent</text>
    <text x="754" y="459" fill="#64748b" font-size="13">MCP / recipes / sessions / policy</text>

    <rect x="775" y="182" width="286" height="112" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="799" y="216" fill="#c2410c" font-size="22" font-weight="700">OpenHands</text>
    <text x="799" y="244" fill="#0f172a" font-size="15" font-weight="600">Agent platform and control plane</text>
    <text x="799" y="268" fill="#64748b" font-size="13">backends / automation / server / SDK</text>

    <rect x="688" y="511" width="402" height="26" rx="4" fill="#e2e8f0"/>
    <text x="704" y="529" fill="#475569" font-size="12">Position indicates default product posture, not a hard capability limit.</text>
  </g>
</svg>
