<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Necessary and sufficient capability relation</title><desc id="d">Task requirements determine necessary capabilities while implementation choices such as single omni models remain optional.</desc><rect width="1200" height="660" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="64" y="66" font-size="28" font-weight="700" fill="#172033">Necessary for the task is not necessary in one model</text><text x="64" y="99" font-size="16" fill="#667085">Start from the task contract; then choose an implementation.</text><rect x="65" y="155" width="280" height="390" rx="8" fill="#fff" stroke="#4c7ee8" stroke-width="2"/><text x="94" y="198" font-size="20" font-weight="700" fill="#2457b8">TASK CONDITIONS</text><text x="94" y="245" font-size="15" fill="#344054">irreducible modalities?</text><text x="94" y="285" font-size="15" fill="#344054">input during output?</text><text x="94" y="325" font-size="15" fill="#344054">online plan revision?</text><text x="94" y="365" font-size="15" fill="#344054">external state / side effects?</text><text x="94" y="405" font-size="15" fill="#344054">cross-session state?</text><text x="94" y="445" font-size="15" fill="#344054">high-risk transaction?</text><rect x="456" y="135" width="288" height="430" rx="8" fill="#eef8f2" stroke="#46a477" stroke-width="3"/><text x="484" y="178" font-size="20" font-weight="700" fill="#24734d">REQUIRED CONTRACT</text><text x="484" y="225" font-size="15" fill="#344054">Pₜ · perception coverage</text><text x="484" y="265" font-size="15" fill="#344054">S · streaming state</text><text x="484" y="305" font-size="15" fill="#344054">Cₜ · interaction control</text><text x="484" y="345" font-size="15" fill="#344054">Rₜ · reasoning</text><text x="484" y="385" font-size="15" fill="#344054">Aₜ · action</text><text x="484" y="425" font-size="15" fill="#344054">Eₜ · recovery</text><text x="484" y="465" font-size="15" fill="#344054">Gₜ · governance</text><rect x="855" y="155" width="280" height="390" rx="8" fill="#f3efff" stroke="#8062c7" stroke-width="2"/><text x="884" y="198" font-size="20" font-weight="700" fill="#6647ae">IMPLEMENTATION</text><text x="884" y="245" font-size="15" fill="#344054">single Omni or modules</text><text x="884" y="285" font-size="15" fill="#344054">system or model duplex</text><text x="884" y="325" font-size="15" fill="#344054">action head or planner</text><text x="884" y="365" font-size="15" fill="#344054">one model or async layers</text><text x="884" y="405" font-size="15" fill="#344054">workflow or multi-agent</text><text x="884" y="445" font-size="15" fill="#344054">local or cloud execution</text><path d="M345 350H440" stroke="#98a2b3" stroke-width="2" marker-end="url(#a)"/><path d="M744 350H839" stroke="#98a2b3" stroke-width="2" marker-end="url(#a)"/><text x="600" y="614" text-anchor="middle" font-size="17" font-weight="700" fill="#b42318">Omni ∧ duplex ∧ agentic is still insufficient without repair, permission and commit safety.</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#98a2b3"/></marker></defs></svg>
