<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Natural interaction scenario matrix</title><desc id="d">Tutoring, phone sales, banking and three meeting roles require different combinations of multimodal, duplex, agentic, memory and governance capabilities.</desc><rect width="1200" height="660" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="64" y="66" font-size="28" font-weight="700" fill="#172033">Choose capabilities by role and task, not by trend</text><text x="64" y="99" font-size="16" fill="#667085">Default requirements; product variants can change individual cells.</text><g transform="translate(64 145)"><rect width="1072" height="404" rx="8" fill="#fff" stroke="#d0d5dd"/><g font-size="14" fill="#344054"><text x="30" y="48" font-weight="700">SCENARIO</text><text x="330" y="48" text-anchor="middle" font-weight="700">MULTIMODAL</text><text x="470" y="48" text-anchor="middle" font-weight="700">SYSTEM DUPLEX</text><text x="620" y="48" text-anchor="middle" font-weight="700">SEMANTIC DUPLEX</text><text x="760" y="48" text-anchor="middle" font-weight="700">AGENTIC</text><text x="880" y="48" text-anchor="middle" font-weight="700">MEMORY</text><text x="1000" y="48" text-anchor="middle" font-weight="700">GOVERNANCE</text></g><g stroke="#e4e7ec"><path d="M0 72H1072M0 127H1072M0 182H1072M0 237H1072M0 292H1072M0 347H1072"/></g><g font-size="15" fill="#172033"><text x="30" y="107">Tutoring with board</text><text x="30" y="162">Phone sales</text><text x="30" y="217">Banking service</text><text x="30" y="272">Meeting recorder</text><text x="30" y="327">Private meeting copilot</text><text x="30" y="382">Active moderator</text></g><g font-size="20" text-anchor="middle"><g fill="#24734d"><circle cx="330" cy="101" r="7"/><circle cx="470" cy="101" r="7"/><circle cx="880" cy="101" r="7"/><circle cx="470" cy="156" r="7"/><circle cx="620" cy="156" r="7"/><circle cx="760" cy="156" r="7"/><circle cx="880" cy="156" r="7"/><circle cx="470" cy="211" r="7"/><circle cx="760" cy="211" r="7"/><circle cx="880" cy="211" r="7"/><circle cx="1000" cy="211" r="7"/><circle cx="330" cy="266" r="7"/><circle cx="880" cy="266" r="7"/><circle cx="330" cy="321" r="7"/><circle cx="760" cy="321" r="7"/><circle cx="880" cy="321" r="7"/><circle cx="330" cy="376" r="7"/><circle cx="470" cy="376" r="7"/><circle cx="620" cy="376" r="7"/><circle cx="760" cy="376" r="7"/><circle cx="880" cy="376" r="7"/></g><g fill="#98a2b3"><circle cx="620" cy="101" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="760" cy="101" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="1000" cy="101" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="330" cy="156" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="1000" cy="156" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="330" cy="211" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="620" cy="211" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="470" cy="266" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="620" cy="266" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="760" cy="266" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="1000" cy="266" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="470" cy="321" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="620" cy="321" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="1000" cy="321" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/><circle cx="1000" cy="376" r="7" fill="none" stroke="#98a2b3" stroke-width="2"/></g></g></g><circle cx="78" cy="596" r="7" fill="#46a477"/><text x="96" y="602" font-size="15" fill="#344054">default requirement</text><circle cx="270" cy="596" r="7" fill="#98a2b3"/><text x="288" y="602" font-size="15" fill="#344054">conditional or optional</text><text x="600" y="635" text-anchor="middle" font-size="15" fill="#667085">Banking governance is mandatory for side effects; meeting duplex depends on whether the assistant is allowed to speak.</text></g></svg>
