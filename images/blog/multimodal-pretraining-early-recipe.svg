<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Early unification and asymmetric data recipe</title>
  <desc id="desc">A fixed training budget is contrasted between late visual alignment and early joint training, followed by the 70 percent language, 25 percent understanding, and 5 percent generation recipe.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#172033" flood-opacity=".1"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#718292"/></marker>
  </defs>
  <rect width="1180" height="720" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#172033">Unify Early, Allocate Asymmetrically</text>
  <text x="60" y="96" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5d6876">Timing decides whether modalities co-evolve; knowledge-flow direction decides where the token budget goes.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="60" y="145" width="500" height="205" rx="8" fill="#fff0ee" stroke="#e4b9b2"/>
    <text x="90" y="184" font-size="20" font-weight="800" fill="#9a4035">Late alignment under a fixed budget</text>
    <rect x="90" y="220" width="310" height="54" rx="6" fill="#286fa3"/>
    <text x="245" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">language-only warm-up</text>
    <rect x="400" y="220" width="130" height="54" rx="6" fill="#7b8a98"/>
    <text x="465" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">joint tail</text>
    <text x="90" y="307" font-size="14" fill="#7b5954">Language gains plateau; visual participation shrinks.</text>
    <text x="90" y="330" font-size="14" fill="#7b5954">Vision activations and image attention decline.</text>

    <rect x="620" y="145" width="500" height="205" rx="8" fill="#edf8f2" stroke="#9dceb8"/>
    <text x="650" y="184" font-size="20" font-weight="800" fill="#21664e">Early joint training under the same budget</text>
    <rect x="650" y="220" width="440" height="54" rx="6" fill="#258267"/>
    <text x="870" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">language + understanding + generation co-evolve</text>
    <text x="650" y="307" font-size="14" fill="#476b5c">Shared representations form before one path hardens.</text>
    <text x="650" y="330" font-size="14" fill="#476b5c">Joint training beats all six sequential orders.</text>

    <rect x="250" y="450" width="680" height="190" rx="8" fill="#ffffff" stroke="#c8d0d7"/>
    <text x="590" y="490" text-anchor="middle" font-size="21" font-weight="800" fill="#172033">Scaled recipe: 2T tokens, early unification</text>
    <rect x="300" y="528" width="392" height="62" rx="6" fill="#286fa3"/>
    <rect x="692" y="528" width="140" height="62" fill="#258267"/>
    <rect x="832" y="528" width="48" height="62" rx="0" fill="#c57a27"/>
    <text x="496" y="553" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">70% Language</text>
    <text x="496" y="576" text-anchor="middle" font-size="13" fill="#eaf3fa">boosts both vision tasks</text>
    <text x="762" y="553" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">25% Understanding</text>
    <text x="762" y="576" text-anchor="middle" font-size="12" fill="#edf8f2">drives generation</text>
    <text x="856" y="554" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5%</text>
    <text x="856" y="575" text-anchor="middle" font-size="11" fill="#fff3e8">Gen</text>
    <text x="590" y="620" text-anchor="middle" font-size="13" fill="#607083">This ratio is measured for this model, data, tokenizer, objective, and evaluation mix.</text>
  </g>

  <path d="M310 365V430" stroke="#718292" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M870 365V430" stroke="#718292" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
