<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FLAIR latent reasoning result changes</title><desc id="desc">Selected same-model benchmark deltas and full-duplex interaction trade-offs when latent reasoning is enabled.</desc><rect width="1200" height="720" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">What changes when latent reasoning is enabled?</text><text x="62" y="106" font-size="16" fill="#617083">Same-architecture comparisons are more credible than cross-system leaderboard claims</text>
  <rect x="62" y="150" width="535" height="478" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="90" y="191" font-size="19" font-weight="700" fill="#203247">QA and reasoning deltas</text><text x="90" y="218" font-size="13" fill="#617083">FLAIR w/ latent minus FLAIR w/o latent</text><line x1="324" y1="250" x2="324" y2="575" stroke="#8da0b2"/><g font-size="14" fill="#3e5063"><text x="90" y="280">Llama Questions</text><text x="90" y="328">Web Questions</text><text x="90" y="376">TriviaQA</text><text x="90" y="424">SDQA</text><text x="90" y="472">OpenBookQA</text><text x="90" y="520">MMSU</text><text x="90" y="568">CommonEval</text></g><g fill="#35896f"><rect x="324" y="260" width="150" height="24" rx="4"/><rect x="324" y="308" width="39" height="24" rx="4"/><rect x="324" y="404" width="54" height="24" rx="4"/><rect x="324" y="452" width="39" height="24" rx="4"/><rect x="324" y="500" width="180" height="24" rx="4"/><rect x="324" y="548" width="4" height="24" rx="2"/></g><rect x="246" y="356" width="78" height="24" rx="4" fill="#b55a52"/><g font-size="13" font-weight="700"><text x="484" y="278" fill="#28785e">+5.0</text><text x="373" y="326" fill="#28785e">+1.3</text><text x="207" y="374" fill="#a04a44">−2.6</text><text x="388" y="422" fill="#28785e">+1.8</text><text x="373" y="470" fill="#28785e">+1.3</text><text x="514" y="518" fill="#28785e">+6.0</text><text x="338" y="566" fill="#28785e">+0.11</text></g>
  <rect x="635" y="150" width="503" height="478" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="663" y="191" font-size="19" font-weight="700" fill="#203247">Full-Duplex-Bench trade-offs</text><text x="663" y="218" font-size="13" fill="#617083">w/o latent → w/ latent</text><g font-size="14"><rect x="663" y="250" width="447" height="70" rx="6" fill="#e8f5ef"/><text x="685" y="278" font-weight="700" fill="#28785e">Barge-in response quality</text><text x="685" y="303" fill="#41695b">4.08 → 4.22</text><rect x="663" y="334" width="447" height="70" rx="6" fill="#e8f5ef"/><text x="685" y="362" font-weight="700" fill="#28785e">Barge-in TOR</text><text x="685" y="387" fill="#41695b">89.0 → 92.0</text><rect x="663" y="418" width="215" height="126" rx="6" fill="#f7e9e7"/><text x="685" y="449" font-weight="700" fill="#a04a44">Turn latency</text><text x="685" y="475" fill="#754d49">0.37s → 0.43s</text><text x="685" y="515" font-weight="700" fill="#a04a44">Turn TOR</text><text x="685" y="539" fill="#754d49">94.1 → 93.0</text><rect x="895" y="418" width="215" height="126" rx="6" fill="#fff1dc"/><text x="917" y="449" font-weight="700" fill="#73532f">Barge-in latency</text><text x="917" y="475" fill="#73532f">0.35s → 0.36s</text><text x="917" y="515" font-weight="700" fill="#73532f">Interpretation</text><text x="917" y="539" fill="#73532f">small, nonzero cost</text></g><text x="663" y="584" font-size="13" fill="#617083">Better semantic response does not imply every timing metric improves.</text>
  <g font-size="13"><rect x="62" y="656" width="18" height="18" rx="3" fill="#35896f"/><text x="90" y="670" fill="#516375">improvement</text><rect x="200" y="656" width="18" height="18" rx="3" fill="#b55a52"/><text x="228" y="670" fill="#516375">regression</text><text x="635" y="670" fill="#617083">No confidence intervals are reported; small deltas should be read cautiously.</text></g></g>
</svg>
