<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Freeze and loss map for stage-wise Omni training</title>
  <desc id="desc">A matrix shows which model modules are trained, frozen, or lightly adapted across alignment, streaming, duplex, speech preference, control reinforcement learning, and agentic reinforcement learning stages.</desc>
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="64" y="66" fill="#172033" font-family="Arial, sans-serif" font-size="30" font-weight="700">CONTROL DRIFT WITH FREEZE BOUNDARIES</text>
  <text x="64" y="98" fill="#526075" font-family="Arial, sans-serif" font-size="17">Open only the modules required by the new capability. Keep every prior regression gate active.</text>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="140" width="1072" height="418" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="64" y="140" width="1072" height="58" rx="8" fill="#eef2f7"/>
    <g fill="#172033" font-size="13" font-weight="700" text-anchor="middle">
      <text x="390" y="175">ENCODER</text><text x="516" y="175">ALIGNER</text><text x="642" y="175">THINKER</text>
      <text x="768" y="175">CONTROL</text><text x="894" y="175">TALKER</text><text x="1020" y="175">CODEC</text>
    </g>
    <g fill="#172033" font-size="14" font-weight="700">
      <text x="86" y="238">Alignment</text><text x="86" y="296">Single stream</text><text x="86" y="354">Duplex mid-train</text>
      <text x="86" y="412">Talker DPO</text><text x="86" y="470">Control RL</text><text x="86" y="528">Agentic RL</text>
    </g>
    <g stroke="#e2e8f0"><line x1="64" y1="256" x2="1136" y2="256"/><line x1="64" y1="314" x2="1136" y2="314"/>
      <line x1="64" y1="372" x2="1136" y2="372"/><line x1="64" y1="430" x2="1136" y2="430"/>
      <line x1="64" y1="488" x2="1136" y2="488"/>
    </g>
    <g stroke="#e2e8f0"><line x1="327" y1="140" x2="327" y2="558"/><line x1="453" y1="140" x2="453" y2="558"/>
      <line x1="579" y1="140" x2="579" y2="558"/><line x1="705" y1="140" x2="705" y2="558"/>
      <line x1="831" y1="140" x2="831" y2="558"/><line x1="957" y1="140" x2="957" y2="558"/><line x1="1083" y1="140" x2="1083" y2="558"/>
    </g>
    <g text-anchor="middle" font-size="12" font-weight="700">
      <g fill="#64748b"><text x="390" y="238">FROZEN</text><text x="642" y="238">FROZEN</text><text x="768" y="238">FROZEN</text><text x="894" y="238">FROZEN</text><text x="1020" y="238">FROZEN</text></g>
      <text x="516" y="238" fill="#2563eb">TRAIN</text>
      <text x="390" y="296" fill="#64748b">FROZEN</text><text x="516" y="296" fill="#2563eb">TRAIN</text><text x="642" y="296" fill="#7c3aed">LIGHT</text><text x="768" y="296" fill="#64748b">FROZEN</text><text x="894" y="296" fill="#15803d">LIGHT</text><text x="1020" y="296" fill="#64748b">FROZEN</text>
      <text x="390" y="354" fill="#64748b">FROZEN</text><text x="516" y="354" fill="#2563eb">LIGHT</text><text x="642" y="354" fill="#7c3aed">ALT</text><text x="768" y="354" fill="#7c3aed">TRAIN</text><text x="894" y="354" fill="#15803d">ALT</text><text x="1020" y="354" fill="#64748b">FROZEN</text>
      <text x="390" y="412" fill="#64748b">FROZEN</text><text x="516" y="412" fill="#64748b">FROZEN</text><text x="642" y="412" fill="#64748b">FROZEN</text><text x="768" y="412" fill="#64748b">FROZEN</text><text x="894" y="412" fill="#15803d">TRAIN</text><text x="1020" y="412" fill="#64748b">FROZEN</text>
      <text x="390" y="470" fill="#64748b">FROZEN</text><text x="516" y="470" fill="#64748b">FROZEN</text><text x="642" y="470" fill="#7c3aed">LIGHT</text><text x="768" y="470" fill="#dc2626">TRAIN</text><text x="894" y="470" fill="#64748b">FROZEN</text><text x="1020" y="470" fill="#64748b">FROZEN</text>
      <text x="390" y="528" fill="#64748b">FROZEN</text><text x="516" y="528" fill="#64748b">FROZEN</text><text x="642" y="528" fill="#7c3aed">LIGHT</text><text x="768" y="528" fill="#dc2626">TRAIN</text><text x="894" y="528" fill="#64748b">FROZEN</text><text x="1020" y="528" fill="#64748b">FROZEN</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="64" y="586" width="18" height="18" rx="4" fill="#2563eb"/><text x="92" y="600" fill="#526075">perception / alignment</text>
    <rect x="285" y="586" width="18" height="18" rx="4" fill="#7c3aed"/><text x="313" y="600" fill="#526075">reasoning / state</text>
    <rect x="486" y="586" width="18" height="18" rx="4" fill="#15803d"/><text x="514" y="600" fill="#526075">speech generation</text>
    <rect x="696" y="586" width="18" height="18" rx="4" fill="#dc2626"/><text x="724" y="600" fill="#526075">policy optimization</text>
    <rect x="923" y="586" width="18" height="18" rx="4" fill="#64748b"/><text x="951" y="600" fill="#526075">frozen boundary</text>
  </g>
</svg>
