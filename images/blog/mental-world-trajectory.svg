<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">MENTIS mental world modeling trajectory</title><desc id="desc">Joint state, target observation, candidate actions, successor states, value and final decision.</desc><rect width="1200" height="690" fill="#f4f7fa"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">MENTIS: an inspectable decision trajectory</text><text x="62" y="106" font-family="Arial,sans-serif" font-size="16" fill="#617083">Mental variables enter observation, transition and branch evaluation</text>
  <g font-family="Arial,sans-serif"><rect x="62" y="156" width="244" height="168" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="86" y="194" font-size="17" font-weight="700" fill="#203247">1. Current joint state</text><rect x="86" y="216" width="91" height="76" rx="6" fill="#e8f1f9"/><text x="105" y="248" font-size="14" font-weight="700" fill="#2f6e9f">Physical</text><text x="103" y="272" font-size="12" fill="#516375">scene</text><rect x="191" y="216" width="91" height="76" rx="6" fill="#e8f5ef"/><text x="209" y="248" font-size="14" font-weight="700" fill="#28785e">Mental</text><text x="212" y="272" font-size="12" fill="#516375">minds</text>
    <rect x="354" y="156" width="214" height="168" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="378" y="194" font-size="17" font-weight="700" fill="#203247">2. Target observation</text><text x="378" y="230" font-size="14" fill="#516375">what target can perceive</text><text x="378" y="258" font-size="14" fill="#516375">self + first-order ToM</text><rect x="378" y="278" width="166" height="25" rx="5" fill="#fff1dc"/><text x="397" y="296" font-size="12" font-weight="700" fill="#9b642a">Unknown blocks leakage</text>
    <rect x="616" y="156" width="214" height="168" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="640" y="194" font-size="17" font-weight="700" fill="#203247">3. Action branches</text><g font-size="13" fill="#516375"><text x="640" y="228">A: physical + mental</text><text x="640" y="254">B: physical + mental</text><text x="640" y="280">… six plausible options</text></g>
    <rect x="878" y="156" width="260" height="168" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="902" y="194" font-size="17" font-weight="700" fill="#203247">4. Coupled transition</text><text x="902" y="228" font-size="14" fill="#516375">simulate s(t+1) for every option</text><text x="902" y="258" font-size="14" fill="#516375">physical change ↔ mental change</text><text x="902" y="288" font-size="14" font-weight="700" fill="#a15946">largest oracle bottleneck: +3.5</text>
    <path d="M306 240h48M568 240h48M830 240h48" stroke="#70869b" stroke-width="2"/><g fill="#70869b"><path d="M350 235l8 5-8 5z"/><path d="M612 235l8 5-8 5z"/><path d="M874 235l8 5-8 5z"/></g>
    <rect x="210" y="398" width="780" height="190" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="242" y="438" font-size="18" font-weight="700" fill="#203247">5. Branch value</text><g font-size="14"><rect x="242" y="462" width="196" height="45" rx="6" fill="#e8f5ef"/><text x="265" y="490" fill="#28785e" font-weight="700">Mental consistency · 0.45</text><rect x="454" y="462" width="196" height="45" rx="6" fill="#e8f1f9"/><text x="477" y="490" fill="#2f6e9f" font-weight="700">Physical plausibility · 0.35</text><rect x="666" y="462" width="196" height="45" rx="6" fill="#fff1dc"/><text x="686" y="490" fill="#9b642a" font-weight="700">Social appropriateness · 0.20</text></g><rect x="242" y="526" width="620" height="36" rx="6" fill="#f7e9e7"/><text x="263" y="550" font-size="14" font-weight="700" fill="#a34f42">Safety / legality veto</text><path d="M862 544h90" stroke="#70869b" stroke-width="2"/><path d="M948 539l8 5-8 5z" fill="#70869b"/><rect x="892" y="518" width="66" height="52" rx="6" fill="#263b50"/><text x="908" y="550" font-size="14" font-weight="700" fill="#fff">Choice</text>
    <text x="430" y="636" font-size="15" fill="#617083">Every intermediate artifact is retained for stage-level diagnosis</text>
  </g>
</svg>
