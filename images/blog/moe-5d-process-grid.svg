<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">MoE five-dimensional process grid</title>
  <desc id="desc">A five-dimensional rank coordinate with data, pipeline, context, expert, and tensor dimensions, plus sequence parallel and sharded data parallel annotations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6f2"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#182333" flood-opacity=".1"/></filter>
  </defs>
  <rect width="1180" height="700" fill="url(#bg)"/>
  <text x="60" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#172033">A Precise 5D MoE Coordinate System</text>
  <text x="60" y="96" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5d6876">Name every independent process-group axis; annotate SP and ZeRO/FSDP without pretending they multiply world size.</text>
  <g filter="url(#shadow)"><rect x="60" y="142" width="1060" height="390" rx="8" fill="#fff" stroke="#d8e2ec"/></g>
  <text x="590" y="198" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="28" font-weight="800" fill="#172033">rank = ( d , p , c , e , t )</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(90 242)"><rect width="180" height="220" rx="7" fill="#eaf3fa" stroke="#c7dbe9"/><text x="90" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#286fa3">DP</text><text x="90" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#334154">expert-data replicas</text><line x1="24" y1="102" x2="156" y2="102" stroke="#c7dbe9"/><text x="90" y="132" text-anchor="middle" font-size="14" fill="#526274">gradient sync</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#526274">ZeRO / FSDP lives</text><text x="90" y="184" text-anchor="middle" font-size="14" fill="#526274">inside this axis</text></g>
    <g transform="translate(295 242)"><rect width="180" height="220" rx="7" fill="#f1eef9" stroke="#d4cae9"/><text x="90" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#6d5595">PP</text><text x="90" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#334154">model depth</text><line x1="24" y1="102" x2="156" y2="102" stroke="#d4cae9"/><text x="90" y="132" text-anchor="middle" font-size="14" fill="#526274">activation P2P</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#526274">micro-batches</text><text x="90" y="184" text-anchor="middle" font-size="14" fill="#526274">pipeline bubble</text></g>
    <g transform="translate(500 242)"><rect width="180" height="220" rx="7" fill="#edf8f2" stroke="#bdddcf"/><text x="90" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#258267">CP</text><text x="90" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#334154">full sequence</text><line x1="24" y1="102" x2="156" y2="102" stroke="#bdddcf"/><text x="90" y="132" text-anchor="middle" font-size="14" fill="#526274">KV exchange</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#526274">independent group</text><text x="90" y="184" text-anchor="middle" font-size="14" fill="#526274">long context</text></g>
    <g transform="translate(705 242)"><rect width="180" height="220" rx="7" fill="#fff3e8" stroke="#ebc79f"/><text x="90" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#a85d20">EP</text><text x="90" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#334154">MoE experts</text><line x1="24" y1="102" x2="156" y2="102" stroke="#ebc79f"/><text x="90" y="132" text-anchor="middle" font-size="14" fill="#526274">token All-to-All</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#526274">router balance</text><text x="90" y="184" text-anchor="middle" font-size="14" fill="#526274">expert ownership</text></g>
    <g transform="translate(910 242)"><rect width="180" height="220" rx="7" fill="#faeeee" stroke="#e6c2c2"/><text x="90" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="#b84545">TP</text><text x="90" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#334154">layer tensors</text><line x1="24" y1="102" x2="156" y2="102" stroke="#e6c2c2"/><text x="90" y="132" text-anchor="middle" font-size="14" fill="#526274">layer collectives</text><text x="90" y="158" text-anchor="middle" font-size="14" fill="#526274">SP reuses this group</text><text x="90" y="184" text-anchor="middle" font-size="14" fill="#526274">high-bandwidth fabric</text></g>
  </g>
  <rect x="180" y="570" width="820" height="62" rx="6" fill="#172033"/>
  <text x="590" y="608" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" fill="#fff">World size = DP × PP × CP × EP × TP</text>
  <text x="590" y="668" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#607083">Always define whether DP means dense-DP or expert-data replication before multiplying.</text>
</svg>
