<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Controlled experiment for team harness value</title>
  <desc id="desc">Three groups compare ordinary Git and chat, structured trace visibility, and a complete team harness with task contracts, interventions, and handoffs on repeated edge model adaptation tasks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="64" y="62" fill="#172033" font-family="Arial, sans-serif" font-size="30" font-weight="700">TEST THE MANAGEMENT CLAIM BEFORE SCALING THE PLATFORM</text>
  <text x="64" y="94" fill="#526075" font-family="Arial, sans-serif" font-size="17">Use repeated edge-model adaptation tasks to separate visibility gains from intervention gains.</text>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="130" width="1072" height="84" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="92" y="164" fill="#526075" font-size="14" font-weight="700">RANDOMIZED TASKS</text>
    <text x="92" y="193" fill="#172033" font-size="18" font-weight="700">Model × board × dataset, with seeded scope drift, stale decisions, runtime mismatch, outage, and handoff</text>
    <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M600 215 V258"/><path d="M600 242 H236 V258"/><path d="M600 242 H964 V258"/></g>
    <g>
      <rect x="64" y="259" width="336" height="194" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="64" y="259" width="336" height="10" rx="5" fill="#64748b"/>
      <text x="88" y="307" fill="#475569" font-size="16" font-weight="700">A · BASELINE</text>
      <text x="88" y="344" fill="#172033" font-size="20" font-weight="700">Git + chat + local agent</text>
      <text x="88" y="382" fill="#526075" font-size="15">Current coordination practice</text>
      <text x="88" y="416" fill="#9a3412" font-size="14" font-weight="700">Measures the starting point</text>
      <rect x="432" y="259" width="336" height="194" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <rect x="432" y="259" width="336" height="10" rx="5" fill="#2563eb"/>
      <text x="456" y="307" fill="#1d4ed8" font-size="16" font-weight="700">B · VISIBILITY</text>
      <text x="456" y="344" fill="#172033" font-size="20" font-weight="700">A + trace + status cards</text>
      <text x="456" y="382" fill="#526075" font-size="15">Structured events and evidence</text>
      <text x="456" y="416" fill="#1d4ed8" font-size="14" font-weight="700">Is transparency alone useful?</text>
      <rect x="800" y="259" width="336" height="194" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
      <rect x="800" y="259" width="336" height="10" rx="5" fill="#0f766e"/>
      <text x="824" y="307" fill="#0f766e" font-size="16" font-weight="700">C · CONTROL</text>
      <text x="824" y="344" fill="#172033" font-size="20" font-weight="700">B + contract + handoff</text>
      <text x="824" y="382" fill="#526075" font-size="15">Audited intervention protocol</text>
      <text x="824" y="416" fill="#0f766e" font-size="14" font-weight="700">Does closed-loop control help?</text>
    </g>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M232 454 V497"/><path d="M600 454 V497"/><path d="M968 454 V497"/></g>
    <rect x="64" y="498" width="1072" height="112" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="92" y="533" fill="#526075" font-size="14" font-weight="700">PRIMARY OUTCOMES</text>
    <g fill="#172033" font-size="16" font-weight="700">
      <text x="92" y="568">Task success</text><text x="260" y="568">Drift detection</text><text x="455" y="568">Verified artifact time</text>
      <text x="700" y="568">Handoff recovery</text><text x="910" y="568">Manager attention</text>
    </g>
    <text x="600" y="638" fill="#526075" font-size="14" text-anchor="middle">Reject the product hypothesis if control increases interruptions, gaming, unsafe takeover, or perceived loss of autonomy.</text>
  </g>
</svg>
