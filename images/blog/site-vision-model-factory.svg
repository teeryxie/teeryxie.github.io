<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Site-specific micro-model factory</title><desc id="desc">Historical video and a task contract pass through an agentic data, training, deployment and monitoring pipeline.</desc><rect width="1200" height="700" fill="#f4f7fa"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">Site-Specific Model Factory</text><text x="62" y="106" font-family="Arial,sans-serif" font-size="16" fill="#617083">Standardize the compiler, not the model weights</text>
  <g font-family="Arial,sans-serif"><rect x="62" y="158" width="220" height="432" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="88" y="200" font-size="19" font-weight="700" fill="#203247">Site contract</text><g font-size="14" fill="#506275"><rect x="88" y="232" width="168" height="44" rx="6" fill="#e8f1f9"/><text x="121" y="259">camera + history</text><rect x="88" y="290" width="168" height="44" rx="6" fill="#e8f1f9"/><text x="121" y="317">ROI + event label</text><rect x="88" y="348" width="168" height="44" rx="6" fill="#e8f1f9"/><text x="116" y="375">error budget + SLA</text><rect x="88" y="406" width="168" height="44" rx="6" fill="#e8f1f9"/><text x="111" y="433">hardware constraints</text><rect x="88" y="464" width="168" height="44" rx="6" fill="#e8f1f9"/><text x="114" y="491">privacy + retention</text></g>
    <rect x="342" y="158" width="516" height="432" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="368" y="200" font-size="19" font-weight="700" fill="#203247">Agentic compiler</text><g font-size="14" font-weight="700"><rect x="368" y="232" width="204" height="58" rx="6" fill="#e8f5ef"/><text x="408" y="267" fill="#28785e">1. Candidate mining</text><rect x="628" y="232" width="204" height="58" rx="6" fill="#fff1dc"/><text x="672" y="267" fill="#8f5d28">2. VLM weak labels</text><rect x="368" y="318" width="204" height="58" rx="6" fill="#f2eafb"/><text x="412" y="353" fill="#765196">3. Human review</text><rect x="628" y="318" width="204" height="58" rx="6" fill="#e8f1f9"/><text x="665" y="353" fill="#2f6e9f">4. Train specialist</text><rect x="368" y="404" width="204" height="58" rx="6" fill="#fff1dc"/><text x="399" y="439" fill="#8f5d28">5. Compress + compile</text><rect x="628" y="404" width="204" height="58" rx="6" fill="#e8f5ef"/><text x="669" y="439" fill="#28785e">6. Shadow + accept</text></g><path d="M572 261h56M730 290v28M628 347h-56M470 376v28M572 433h56" fill="none" stroke="#7e90a2" stroke-width="2"/><text x="368" y="518" font-size="13" fill="#617083">Teacher: general VLM · Executor: tiny local model</text><text x="368" y="546" font-size="13" fill="#617083">Artifacts: weights · thresholds · rules · tests · rollback</text>
    <rect x="918" y="158" width="220" height="432" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="944" y="200" font-size="19" font-weight="700" fill="#203247">Site sensor</text><g font-size="14" fill="#506275"><rect x="944" y="232" width="168" height="54" rx="6" fill="#e7f3ee"/><text x="983" y="264">edge inference</text><rect x="944" y="302" width="168" height="54" rx="6" fill="#e7f3ee"/><text x="986" y="334">event policy</text><rect x="944" y="372" width="168" height="54" rx="6" fill="#e7f3ee"/><text x="982" y="404">health monitor</text><rect x="944" y="442" width="168" height="54" rx="6" fill="#e7f3ee"/><text x="983" y="474">drift + feedback</text></g><text x="966" y="548" font-size="14" font-weight="700" fill="#28785e">Outcome, not a model</text>
    <path d="M282 374h60M858 374h60" stroke="#70869b" stroke-width="2"/><path d="M338 369l8 5-8 5zM914 369l8 5-8 5z" fill="#70869b"/>
  </g>
</svg>
