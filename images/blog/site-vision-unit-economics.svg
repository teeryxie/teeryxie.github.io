<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Unit economics of a site-specific vision service</title><desc id="desc">Revenue is reduced by hardware, installation, compute, review, support and retraining costs.</desc><rect width="1200" height="690" fill="#f4f7fa"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">The margin is decided after the model ships</text><text x="62" y="106" font-family="Arial,sans-serif" font-size="16" fill="#617083">Agent automation must reduce human minutes, truck rolls and false-alert support</text>
  <g font-family="Arial,sans-serif"><rect x="62" y="156" width="1076" height="416" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="94" y="200" width="214" height="322" rx="8" fill="#e7f3ee"/><text x="120" y="238" font-size="18" font-weight="700" fill="#28785e">Site revenue</text><text x="120" y="286" font-size="15" fill="#3f5766">setup fee</text><text x="120" y="322" font-size="15" fill="#3f5766">camera subscription</text><text x="120" y="358" font-size="15" fill="#3f5766">SLA / review</text><text x="120" y="394" font-size="15" fill="#3f5766">workflow integration</text><text x="120" y="452" font-size="15" font-weight="700" fill="#28785e">value captured</text>
    <text x="342" y="368" font-size="34" font-weight="700" fill="#718497">−</text><rect x="398" y="200" width="440" height="322" rx="8" fill="#f7e9e7"/><text x="424" y="238" font-size="18" font-weight="700" fill="#a34f42">Cost to serve</text><g font-size="14" fill="#4c5e70"><text x="424" y="282">hardware amortization</text><text x="424" y="316">installation + truck rolls</text><text x="424" y="350">storage + teacher + training compute</text><text x="424" y="384">human review + escalation</text><text x="424" y="418">support + replacement</text><text x="424" y="452">retraining + rollback</text></g><rect x="650" y="266" width="156" height="180" rx="6" fill="#fff"/><text x="676" y="300" font-size="13" font-weight="700" fill="#a34f42">Margin killers</text><text x="676" y="334" font-size="13" fill="#536477">weekly manual review</text><text x="676" y="364" font-size="13" fill="#536477">camera movement</text><text x="676" y="394" font-size="13" fill="#536477">alert fatigue</text><text x="676" y="424" font-size="13" fill="#536477">onsite recovery</text>
    <text x="864" y="368" font-size="34" font-weight="700" fill="#718497">=</text><rect x="920" y="200" width="186" height="322" rx="8" fill="#e8f1f9"/><text x="946" y="238" font-size="18" font-weight="700" fill="#2f6e9f">Contribution</text><text x="946" y="264" font-size="18" font-weight="700" fill="#2f6e9f">margin</text><path d="M952 424h122" stroke="#d2dce5" stroke-width="100"/><path d="M952 424h76" stroke="#4b82b1" stroke-width="100"/><text x="970" y="430" font-size="16" font-weight="700" fill="#fff">scale</text><text x="946" y="498" font-size="13" fill="#536477">per camera-month</text>
    <rect x="208" y="604" width="784" height="48" rx="6" fill="#263b50"/><text x="259" y="635" font-size="15" font-weight="700" fill="#fff">North-star metric: human review minutes per accepted camera-week</text>
  </g>
</svg>
