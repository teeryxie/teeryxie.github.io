<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark-grounded data flywheel</title>
  <desc id="desc">A data flywheel moving from immutable benchmark contracts to failure slices, candidate data, filtering, shadow training, and promotion.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#64717c"/></marker></defs>
  <rect width="1200" height="760" fill="#f7f8fa"/>
  <text x="70" y="67" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17212b">Benchmark-grounded data flywheel</text>
  <text x="70" y="103" font-family="Arial, sans-serif" font-size="16" fill="#5e6871">The benchmark defines the contract and exposes failure slices; quarantined items never become generation prompts.</text>
  <g font-family="Arial, sans-serif">
    <rect x="445" y="140" width="310" height="105" rx="8" fill="#202b34"/>
    <text x="478" y="183" font-size="21" font-weight="700" fill="#fff">Immutable Benchmark Contract</text>
    <text x="478" y="218" font-size="15" fill="#cbd3d9">split · metric · verifier · contamination · gate</text>

    <rect x="80" y="300" width="245" height="120" rx="8" fill="#fff" stroke="#6c8baa"/>
    <text x="108" y="342" font-size="19" font-weight="700" fill="#365d84">1 · Evaluate model</text>
    <text x="108" y="378" font-size="15" fill="#526779">failure ledger + evidence</text>

    <rect x="80" y="510" width="245" height="120" rx="8" fill="#fff" stroke="#9d79aa"/>
    <text x="108" y="552" font-size="19" font-weight="700" fill="#6f487d">2 · Mine failure slices</text>
    <text x="108" y="588" font-size="15" fill="#66546d">taxonomy, not test text</text>

    <rect x="478" y="570" width="245" height="120" rx="8" fill="#fff" stroke="#d0a043"/>
    <text x="506" y="612" font-size="19" font-weight="700" fill="#7c5a17">3 · Generate candidates</text>
    <text x="506" y="648" font-size="15" fill="#665735">multi-source + provenance</text>

    <rect x="875" y="510" width="245" height="120" rx="8" fill="#fff" stroke="#2d8f82"/>
    <text x="903" y="552" font-size="19" font-weight="700" fill="#00695c">4 · Multi-gate filter</text>
    <text x="903" y="588" font-size="15" fill="#46605c">verify · dedup · decontam</text>

    <rect x="875" y="300" width="245" height="120" rx="8" fill="#fff" stroke="#d1495b"/>
    <text x="903" y="342" font-size="19" font-weight="700" fill="#aa2c40">5 · Shadow training</text>
    <text x="903" y="378" font-size="15" fill="#704850">multi-seed + retain suite</text>

    <rect x="478" y="310" width="245" height="120" rx="8" fill="#fff" stroke="#475b68" stroke-width="2"/>
    <text x="506" y="352" font-size="19" font-weight="700" fill="#2c3f4b">6 · Promotion gate</text>
    <text x="506" y="388" font-size="15" fill="#53616a">promote · reject · rollback</text>
  </g>
  <g fill="none" stroke="#64717c" stroke-width="3" marker-end="url(#arr)">
    <path d="M445 198C310 205 220 240 205 288"/>
    <path d="M202 420V498"/>
    <path d="M325 580C380 620 420 630 466 630"/>
    <path d="M723 630C785 628 830 605 863 580"/>
    <path d="M998 510V432"/>
    <path d="M875 360H735"/>
    <path d="M600 310V258"/>
  </g>
  <rect x="80" y="690" width="1040" height="38" rx="5" fill="#eef1f3"/>
  <text x="109" y="715" font-family="Arial, sans-serif" font-size="15" fill="#515d66">Control: DataFlow-Harness · Execution: DataFlow operators · Optimization: LoopAI/supervisor · Evidence: versioned manifests</text>
</svg>
