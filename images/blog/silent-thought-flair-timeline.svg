<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FLAIR causal inference timeline</title><desc id="desc">A user speaks while latent embeddings recur, then the model switches to explicit response tokens and returns to listening after a barge-in.</desc><rect width="1200" height="680" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">Inference: one backbone, two autoregressive modes</text><text x="62" y="106" font-size="16" fill="#617083">A timing head switches between continuous latent feedback and discrete response tokens</text>
  <text x="62" y="185" font-size="15" font-weight="700" fill="#3e5063">USER AUDIO</text><rect x="190" y="150" width="476" height="58" rx="7" fill="#e8f1f9" stroke="#7ba1c2"/><path d="M218 181l20-13 20 25 20-37 20 35 20-18 20 7 20-27 20 42 20-20 20 9 20-29 20 31 20-17 20 10 20-24 20 38 20-30 20 21 20-13 20 3" fill="none" stroke="#3d79a8" stroke-width="2"/><rect x="815" y="150" width="260" height="58" rx="7" fill="#f7e9e7" stroke="#c9857e"/><text x="878" y="185" font-size="14" font-weight="700" fill="#a04a44">USER BARGE-IN</text>
  <text x="62" y="294" font-size="15" font-weight="700" fill="#3e5063">GATE G<tspan baseline-shift="sub" font-size="11">t</tspan></text><g font-size="13" font-weight="700"><rect x="190" y="254" width="476" height="58" rx="7" fill="#e8f5ef"/><text x="383" y="289" fill="#28785e">G = 0 · LISTEN</text><rect x="666" y="254" width="149" height="58" rx="7" fill="#f2eafb"/><text x="697" y="289" fill="#72509a">G = 1 · SPEAK</text><rect x="815" y="254" width="260" height="58" rx="7" fill="#e8f5ef"/><text x="885" y="289" fill="#28785e">G = 0 · LISTEN</text></g>
  <text x="62" y="402" font-size="15" font-weight="700" fill="#3e5063">FEEDBACK</text><g fill="#e8f5ef" stroke="#60a48d"><circle cx="232" cy="390" r="29"/><circle cx="324" cy="390" r="29"/><circle cx="416" cy="390" r="29"/><circle cx="508" cy="390" r="29"/><circle cx="600" cy="390" r="29"/></g><g font-size="13" font-weight="700" fill="#28785e"><text x="220" y="395">z1</text><text x="312" y="395">z2</text><text x="404" y="395">z3</text><text x="496" y="395">z4</text><text x="588" y="395">z5</text></g><g fill="#f2eafb" stroke="#9b7bbb"><rect x="672" y="361" width="62" height="58" rx="6"/><rect x="744" y="361" width="62" height="58" rx="6"/></g><g font-size="12" font-weight="700" fill="#72509a"><text x="690" y="395">tok</text><text x="762" y="395">tok</text></g><g fill="#e8f5ef" stroke="#60a48d"><circle cx="865" cy="390" r="29"/><circle cx="957" cy="390" r="29"/><circle cx="1049" cy="390" r="29"/></g><g font-size="13" font-weight="700" fill="#28785e"><text x="853" y="395">z6</text><text x="945" y="395">z7</text><text x="1037" y="395">z8</text></g><path d="M261 390h34M353 390h34M445 390h34M537 390h34M629 390h37M806 390h30M894 390h34M986 390h34" stroke="#70869b" stroke-width="2"/>
  <rect x="190" y="485" width="876" height="88" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="218" y="519" font-size="14" font-weight="700" fill="#203247">Listening recurrence</text><text x="218" y="548" font-size="14" fill="#516375">logits → Softmax over vocabulary → weighted embedding Z<tspan baseline-shift="sub" font-size="10">t</tspan> → next input</text><path d="M648 505v46" stroke="#c4ced7"/><text x="680" y="519" font-size="14" font-weight="700" fill="#203247">Speaking recurrence</text><text x="680" y="548" font-size="14" fill="#516375">explicit token → token embedding → next input</text><text x="62" y="628" font-size="13" fill="#617083">The Global-aware Expert is absent at inference; every state shown here is produced causally from the observed prefix.</text></g>
</svg>
