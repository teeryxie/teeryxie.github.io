<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Site-specific vision opportunity matrix</title><desc id="desc">Use cases are positioned by scene compressibility and economic value.</desc><rect width="1200" height="720" fill="#f4f7fa"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">Where specialization becomes a business</text><text x="62" y="106" font-family="Arial,sans-serif" font-size="16" fill="#617083">Start with observable physical states and valuable actions</text>
  <g font-family="Arial,sans-serif"><rect x="190" y="150" width="850" height="470" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="615" y="150" width="425" height="235" fill="#e7f3ee"/><rect x="190" y="150" width="425" height="235" fill="#f4f6f8"/><rect x="190" y="385" width="425" height="235" fill="#f7e9e7"/><rect x="615" y="385" width="425" height="235" fill="#fff1dc"/><line x1="615" y1="150" x2="615" y2="620" stroke="#b9c8d8"/><line x1="190" y1="385" x2="1040" y2="385" stroke="#b9c8d8"/>
    <text x="640" y="184" font-size="15" font-weight="700" fill="#28785e">START HERE</text><g font-size="14" font-weight="700" fill="#294157"><rect x="654" y="222" width="150" height="42" rx="6" fill="#fff"/><text x="683" y="248">cold-room door</text><rect x="826" y="222" width="170" height="42" rx="6" fill="#fff"/><text x="855" y="248">blocked fire lane</text><rect x="654" y="282" width="150" height="42" rx="6" fill="#fff"/><text x="694" y="308">line blockage</text><rect x="826" y="282" width="170" height="42" rx="6" fill="#fff"/><text x="866" y="308">dock occupancy</text></g>
    <text x="216" y="184" font-size="15" font-weight="700" fill="#617083">AUTOMATE ONLY IF CHEAP</text><g font-size="14" fill="#4d6072"><text x="224" y="240">bin fullness</text><text x="224" y="278">display-light state</text><text x="224" y="316">low-value counting</text></g>
    <text x="216" y="420" font-size="15" font-weight="700" fill="#a34f42">AVOID EARLY</text><g font-size="14" fill="#4d6072"><text x="224" y="476">employee attitude</text><text x="224" y="514">suspicious customer</text><text x="224" y="552">open-world intent</text></g>
    <text x="640" y="420" font-size="15" font-weight="700" fill="#9b642a">NEEDS BETTER SENSING</text><g font-size="14" fill="#4d6072"><text x="650" y="476">tiny smoking cues</text><text x="650" y="514">complex falls at long range</text><text x="650" y="552">high-stakes identity decisions</text></g>
    <text x="524" y="674" font-size="15" font-weight="700" fill="#415568">Scene compressibility →</text><text x="54" y="405" transform="rotate(-90 54 405)" font-size="15" font-weight="700" fill="#415568">Economic value →</text><text x="190" y="646" font-size="12" fill="#617083">low</text><text x="1018" y="646" font-size="12" fill="#617083">high</text><text x="156" y="608" font-size="12" fill="#617083">low</text><text x="150" y="166" font-size="12" fill="#617083">high</text>
  </g>
</svg>
