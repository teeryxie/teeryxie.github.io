<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Online theory of mind policy for full-duplex omni models</title><desc id="desc">Streaming multimodal cues update mental beliefs that drive conversational actions and revisions.</desc><rect width="1200" height="700" fill="#f4f7fa"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">Online ToM as a full-duplex policy loop</text><text x="62" y="106" font-family="Arial,sans-serif" font-size="16" fill="#617083">The useful output is not a psychological label; it is a safer next interaction</text>
  <g font-family="Arial,sans-serif"><rect x="62" y="164" width="236" height="370" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="88" y="204" font-size="18" font-weight="700" fill="#203247">Streaming evidence</text><g font-size="14" fill="#3e5063"><rect x="88" y="234" width="184" height="44" rx="6" fill="#e8f1f9"/><text x="111" y="261">speech + prosody</text><rect x="88" y="292" width="184" height="44" rx="6" fill="#e8f5ef"/><text x="118" y="319">gaze + gesture</text><rect x="88" y="350" width="184" height="44" rx="6" fill="#fff1dc"/><text x="111" y="377">turn timing + overlap</text><rect x="88" y="408" width="184" height="44" rx="6" fill="#f2eafb"/><text x="114" y="435">task + tool events</text><rect x="88" y="466" width="184" height="44" rx="6" fill="#f7e9e7"/><text x="107" y="493">user self-report</text></g>
    <rect x="362" y="164" width="340" height="370" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="388" y="204" font-size="18" font-weight="700" fill="#203247">Mental belief distribution</text><text x="388" y="234" font-size="13" fill="#617083">target: user · perspective: assistant inference</text><g font-size="14"><text x="388" y="284" fill="#3e5063">Confusion</text><rect x="486" y="268" width="168" height="22" rx="5" fill="#e7edf2"/><rect x="486" y="268" width="108" height="22" rx="5" fill="#4b82b1"/><text x="610" y="284" fill="#2f6e9f">0.64</text><text x="388" y="334" fill="#3e5063">Conflict</text><rect x="486" y="318" width="168" height="22" rx="5" fill="#e7edf2"/><rect x="486" y="318" width="39" height="22" rx="5" fill="#c27d3f"/><text x="610" y="334" fill="#9b642a">0.23</text><text x="388" y="384" fill="#3e5063">Hesitation</text><rect x="486" y="368" width="168" height="22" rx="5" fill="#e7edf2"/><rect x="486" y="368" width="22" height="22" rx="5" fill="#35896f"/><text x="610" y="384" fill="#28785e">0.13</text></g><rect x="388" y="424" width="266" height="76" rx="6" fill="#f5f7f9"/><text x="406" y="451" font-size="13" fill="#516375">evidence provenance · valid interval</text><text x="406" y="476" font-size="13" fill="#516375">alternatives · supersession links</text>
    <rect x="766" y="164" width="372" height="370" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="792" y="204" font-size="18" font-weight="700" fill="#203247">Candidate interaction actions</text><g font-size="14" font-weight="700"><rect x="792" y="236" width="142" height="44" rx="6" fill="#eef3f7"/><text x="838" y="263" fill="#415568">WAIT</text><rect x="950" y="236" width="162" height="44" rx="6" fill="#eef3f7"/><text x="982" y="263" fill="#415568">BACKCHANNEL</text><rect x="792" y="296" width="142" height="44" rx="6" fill="#e8f5ef" stroke="#60a48d"/><text x="824" y="323" fill="#28785e">CLARIFY</text><rect x="950" y="296" width="162" height="44" rx="6" fill="#eef3f7"/><text x="995" y="323" fill="#415568">EXPLAIN</text><rect x="792" y="356" width="142" height="44" rx="6" fill="#eef3f7"/><text x="825" y="383" fill="#415568">INTERRUPT</text><rect x="950" y="356" width="162" height="44" rx="6" fill="#eef3f7"/><text x="1010" y="383" fill="#415568">ACT</text></g><text x="792" y="446" font-size="13" fill="#617083">Rank by information gain, task utility,</text><text x="792" y="470" font-size="13" fill="#617083">latency, misread risk and repair cost</text><text x="792" y="506" font-size="14" font-weight="700" fill="#28785e">Selected: minimum-cost clarification</text>
    <path d="M298 350h64M702 350h64" stroke="#70869b" stroke-width="2"/><path d="M358 345l8 5-8 5zM762 345l8 5-8 5z" fill="#70869b"/><path d="M1022 534v62H180v-62" fill="none" stroke="#70869b" stroke-width="2" stroke-dasharray="7 6"/><path d="M175 538l5-8 5 8z" fill="#70869b"/><text x="438" y="628" font-size="15" font-weight="700" fill="#4d6073">Observe the reaction → revise the belief → preserve or rollback the plan</text>
