<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">MeetingToM three-level task hierarchy</title><desc id="desc">Subject, dyadic and group-level theory of mind tasks and their label spaces.</desc>
  <rect width="1200" height="700" fill="#f4f7fa"/><text x="64" y="76" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">MeetingToM: three levels of social inference</text><text x="64" y="110" font-family="Arial,sans-serif" font-size="16" fill="#617083">From one participant to relations and group consensus</text>
  <g font-family="Arial,sans-serif">
    <rect x="64" y="154" width="330" height="472" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="64" y="154" width="330" height="12" rx="6" fill="#3f78a8"/><circle cx="106" cy="216" r="22" fill="#e4eff8"/><text x="99" y="224" font-size="22" font-weight="700" fill="#2e6797">1</text><text x="144" y="211" font-size="21" font-weight="700" fill="#203247">Subject level</text><text x="144" y="237" font-size="14" fill="#617083">5-second close-up</text>
    <g font-size="15" fill="#35475a"><text x="94" y="292">Active Engagement</text><text x="94" y="332">Supportive Endorsement</text><text x="94" y="372">Focused Listening</text><text x="94" y="412">Cognitive Conflict</text><text x="94" y="452">Confused Bewilderment</text><text x="94" y="492">Hesitation</text><text x="94" y="532">Disengaged Withdrawal</text></g>
    <rect x="435" y="154" width="330" height="472" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="435" y="154" width="330" height="12" rx="6" fill="#3c9279"/><circle cx="477" cy="216" r="22" fill="#e0f3ed"/><text x="470" y="224" font-size="22" font-weight="700" fill="#27765f">2</text><text x="515" y="211" font-size="21" font-weight="700" fill="#203247">Dyadic level</text><text x="515" y="237" font-size="14" fill="#617083">Who addresses whom, and how?</text>
    <text x="465" y="300" font-size="14" font-weight="700" fill="#27765f">ADDRESSEE</text><rect x="465" y="320" width="270" height="64" rx="6" fill="#f1f8f5"/><text x="485" y="348" font-size="15" fill="#35475a">A / B / C / D / Multiple</text><text x="485" y="372" font-size="15" fill="#35475a">/ Unknown</text><text x="465" y="430" font-size="14" font-weight="700" fill="#27765f">STANCE</text><rect x="465" y="450" width="270" height="64" rx="6" fill="#f1f8f5"/><text x="485" y="478" font-size="15" fill="#35475a">Support / Oppose / Neutral</text><text x="485" y="502" font-size="15" fill="#35475a">/ Uncertain</text><text x="465" y="558" font-size="14" fill="#617083">Key cue: “you” ± 2 seconds</text>
    <rect x="806" y="154" width="330" height="472" rx="8" fill="#fff" stroke="#b9c8d8"/><rect x="806" y="154" width="330" height="12" rx="6" fill="#c17b3d"/><circle cx="848" cy="216" r="22" fill="#fbecdd"/><text x="841" y="224" font-size="22" font-weight="700" fill="#9d5d27">3</text><text x="886" y="211" font-size="21" font-weight="700" fill="#203247">Group level</text><text x="886" y="237" font-size="14" fill="#617083">Consensus and hidden dissent</text>
    <text x="836" y="300" font-size="14" font-weight="700" fill="#9d5d27">CONSENSUS</text><rect x="836" y="320" width="270" height="112" rx="6" fill="#fdf6ef"/><text x="856" y="348" font-size="15" fill="#35475a">True Consensus</text><text x="856" y="374" font-size="15" fill="#35475a">Pseudo Consensus</text><text x="856" y="400" font-size="15" fill="#35475a">No Consensus / Uncertain</text><text x="836" y="478" font-size="14" font-weight="700" fill="#9d5d27">HIDDEN DISSENTER</text><rect x="836" y="498" width="270" height="64" rx="6" fill="#fdf6ef"/><text x="856" y="526" font-size="15" fill="#35475a">Participant ID / None</text><text x="836" y="596" font-size="14" fill="#617083">Observe speakers and silent listeners</text>
  </g>
  <path d="M394 390h41M765 390h41" stroke="#8292a3" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
