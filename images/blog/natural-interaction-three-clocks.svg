<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Three clock hybrid architecture</title><desc id="d">Fast interaction, cognitive reasoning and slow transaction clocks share state while a commit governor controls side effects.</desc><rect width="1200" height="660" fill="#f7f9fc"/><g font-family="Arial,sans-serif"><text x="64" y="66" font-size="28" font-weight="700" fill="#172033">Interaction-native hybrid architecture</text><text x="64" y="99" font-size="16" fill="#667085">Different work belongs on different clocks.</text><rect x="70" y="146" width="1060" height="72" rx="8" fill="#eaf2ff" stroke="#4c7ee8" stroke-width="2"/><text x="600" y="177" text-anchor="middle" font-size="18" font-weight="700" fill="#2457b8">STREAMING OBSERVATIONS</text><text x="600" y="202" text-anchor="middle" font-size="14" fill="#344054">audio · video · screen · text · playback · events</text><path d="M600 218V262" stroke="#98a2b3" stroke-width="2" marker-end="url(#a)"/><rect x="315" y="262" width="570" height="72" rx="8" fill="#fff" stroke="#172033" stroke-width="2"/><text x="600" y="293" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">SHARED TIMELINE + WORLD / INTERACTION STATE</text><text x="600" y="318" text-anchor="middle" font-size="14" fill="#667085">event bus · provenance · playback position · pending actions</text><path d="M430 334V380M600 334V380M770 334V380" stroke="#98a2b3" stroke-width="2"/><rect x="70" y="380" width="300" height="142" rx="8" fill="#eef8f2" stroke="#46a477" stroke-width="2"/><text x="98" y="419" font-size="20" font-weight="700" fill="#24734d">FAST · INTERACTION</text><text x="98" y="451" font-size="15" fill="#344054">10–500 ms</text><text x="98" y="480" font-size="14" fill="#667085">listen · wait · yield · interrupt</text><rect x="450" y="380" width="300" height="142" rx="8" fill="#f3efff" stroke="#8062c7" stroke-width="2"/><text x="478" y="419" font-size="20" font-weight="700" fill="#6647ae">MID · COGNITION</text><text x="478" y="451" font-size="15" fill="#344054">100 ms–seconds</text><text x="478" y="480" font-size="14" fill="#667085">reason · model user · retrieve</text><rect x="830" y="380" width="300" height="142" rx="8" fill="#fff1f0" stroke="#e05d5d" stroke-width="2"/><text x="858" y="419" font-size="20" font-weight="700" fill="#b42318">SLOW · TRANSACTION</text><text x="858" y="451" font-size="15" fill="#344054">workflow lifecycle</text><text x="858" y="480" font-size="14" fill="#667085">prepare · confirm · commit · audit</text><rect x="315" y="566" width="570" height="50" rx="8" fill="#172033"/><text x="600" y="597" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Commit Governor: permission · idempotency · cancellation · rollback</text><path d="M220 522L380 566M600 522V566M980 522L820 566" stroke="#98a2b3" stroke-width="2"/></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#98a2b3"/></marker></defs></svg>
