<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Trace visibility ladder</title>
  <desc id="desc">A five-level visibility model shows task status by default and reveals plans, excerpts, or raw sessions only when an anomaly, purpose, and authorization justify it.</desc>
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="64" y="62" fill="#172033" font-family="Arial, sans-serif" font-size="30" font-weight="700">OBSERVE EXCEPTIONS, NOT EVERY TOKEN</text>
  <text x="64" y="94" fill="#526075" font-family="Arial, sans-serif" font-size="17">Visibility expands only with a concrete purpose, the right role, and an auditable authorization.</text>
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="74" y="480" width="610" height="88" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
      <text x="98" y="515" fill="#047857" font-size="15" font-weight="700">L0 · SHARED BY DEFAULT</text>
      <text x="98" y="544" fill="#172033" font-size="18" font-weight="700">Task state · owner · deadline</text>
      <rect x="150" y="381" width="534" height="88" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
      <text x="174" y="416" fill="#1d4ed8" font-size="15" font-weight="700">L1 · PROJECT LEAD</text>
      <text x="174" y="445" fill="#172033" font-size="18" font-weight="700">Milestones · evidence · blockers · risk</text>
      <rect x="226" y="282" width="458" height="88" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
      <text x="250" y="317" fill="#6d28d9" font-size="15" font-weight="700">L2 · TECHNICAL REVIEW</text>
      <text x="250" y="346" fill="#172033" font-size="18" font-weight="700">Plan summary · failure class · key events</text>
      <rect x="302" y="183" width="382" height="88" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <text x="326" y="218" fill="#c2410c" font-size="15" font-weight="700">L3 · INCIDENT INVESTIGATION</text>
      <text x="326" y="247" fill="#172033" font-size="18" font-weight="700">Redacted prompt / output excerpts</text>
      <rect x="378" y="114" width="306" height="58" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="531" y="149" fill="#b91c1c" font-size="15" font-weight="700" text-anchor="middle">L4 · TEMPORARY RAW ACCESS</text>
    </g>
    <rect x="748" y="139" width="388" height="397" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="778" y="181" fill="#172033" font-size="20" font-weight="700">ESCALATION GATE</text>
    <line x1="778" y1="198" x2="1106" y2="198" stroke="#e2e8f0" stroke-width="2"/>
    <g fill="#172033" font-size="17" font-weight="700">
      <text x="814" y="240">1. An anomaly exists</text><text x="814" y="299">2. Purpose is explicit</text>
      <text x="814" y="358">3. Role is authorized</text><text x="814" y="417">4. Scope and time are limited</text>
      <text x="814" y="476">5. Access is audited</text>
    </g>
    <g fill="#2563eb"><circle cx="788" cy="234" r="7"/><circle cx="788" cy="293" r="7"/><circle cx="788" cy="352" r="7"/><circle cx="788" cy="411" r="7"/><circle cx="788" cy="470" r="7"/></g>
    <rect x="748" y="555" width="388" height="52" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="942" y="577" fill="#9a3412" font-size="14" font-weight="700" text-anchor="middle">NO PRODUCTIVITY SCORE FROM TOKEN COUNT</text>
    <text x="942" y="596" fill="#9a3412" font-size="13" text-anchor="middle">No silent prompt edits · no always-on raw access</text>
  </g>
</svg>
