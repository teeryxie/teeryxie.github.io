<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Evidence boundaries in DataFlow-Harness</title>
  <desc id="desc">Separates workflow construction reliability, sample quality, and downstream utility evidence.</desc>
  <rect width="1200" height="660" fill="#f7f8fa"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17212b">Do not collapse three different claims into one score</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="145" width="325" height="400" rx="8" fill="#fff" stroke="#2d8f82" stroke-width="2"/>
    <text x="100" y="191" font-size="21" font-weight="700" fill="#00695c">Workflow construction</text>
    <text x="100" y="228" font-size="15" fill="#42605c">12 tasks × 10 trials</text>
    <text x="100" y="280" font-size="46" font-weight="700" fill="#00796b">93.3%</text>
    <text x="100" y="313" font-size="16" fill="#52645f">observed E2E pass rate</text>
    <line x1="100" y1="344" x2="365" y2="344" stroke="#d7ddda"/>
    <text x="100" y="382" font-size="15" fill="#4f5d58">DAG builds and executes</text>
    <text x="100" y="418" font-size="15" fill="#4f5d58">acceptance criteria pass</text>
    <text x="100" y="470" font-size="14" fill="#8b414b">Does not prove every sample</text>
    <text x="100" y="495" font-size="14" fill="#8b414b">is correct or useful.</text>

    <rect x="438" y="145" width="325" height="400" rx="8" fill="#fff" stroke="#d0a043" stroke-width="2"/>
    <text x="468" y="191" font-size="21" font-weight="700" fill="#7c5a17">Output data quality</text>
    <text x="468" y="237" font-size="16" fill="#655735">VQA precision / coverage</text>
    <text x="468" y="276" font-size="16" fill="#655735">deterministic verification</text>
    <text x="468" y="315" font-size="16" fill="#655735">dedup and contamination</text>
    <text x="468" y="354" font-size="16" fill="#655735">difficulty and diversity</text>
    <line x1="468" y1="386" x2="733" y2="386" stroke="#ded8ca"/>
    <text x="468" y="429" font-size="14" fill="#8b414b">Schema validity is necessary,</text>
    <text x="468" y="454" font-size="14" fill="#8b414b">not sufficient.</text>

    <rect x="806" y="145" width="325" height="400" rx="8" fill="#fff" stroke="#d1495b" stroke-width="2"/>
    <text x="836" y="191" font-size="21" font-weight="700" fill="#aa2c40">Downstream utility</text>
    <text x="836" y="237" font-size="16" fill="#704850">matched training budget</text>
    <text x="836" y="276" font-size="16" fill="#704850">target + retain benchmarks</text>
    <text x="836" y="315" font-size="16" fill="#704850">multiple training seeds</text>
    <text x="836" y="354" font-size="16" fill="#704850">outer holdout and variance</text>
    <line x1="836" y1="386" x2="1101" y2="386" stroke="#e4d1d4"/>
    <text x="836" y="429" font-size="14" fill="#8b414b">Paper reports two controlled</text>
    <text x="836" y="454" font-size="14" fill="#8b414b">case studies, not a general</text>
    <text x="836" y="479" font-size="14" fill="#8b414b">causal estimate.</text>
  </g>
  <text x="70" y="610" font-family="Arial, sans-serif" font-size="16" fill="#69737c">A trustworthy flywheel must pass all three evidence layers independently.</text>
</svg>
