<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">Training framework execution paths</title>
  <desc id="desc">Three execution paths show where Megatron, DeepSpeed, and Colossal-AI transform or take ownership of a training job.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#182333" flood-opacity=".1"/></filter>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#286fa3"/></marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c57a27"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#258267"/></marker>
  </defs>
  <rect width="1180" height="700" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#172033">From User Code to Distributed Execution</text>
  <text x="60" y="96" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5d6876">The integration point determines who owns graph transformation, training state, and scheduling.</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="60" y="142" width="1060" height="138" rx="8" fill="#fff" stroke="#d8e2ec"/>
    <rect x="60" y="302" width="1060" height="138" rx="8" fill="#fff" stroke="#d8e2ec"/>
    <rect x="60" y="462" width="1060" height="138" rx="8" fill="#fff" stroke="#d8e2ec"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="88" y="184" font-size="21" font-weight="800" fill="#286fa3">Megatron</text><text x="88" y="212" font-size="13" fill="#607083">model-parallel contract first</text>
    <rect x="260" y="172" width="190" height="74" rx="6" fill="#eaf3fa" stroke="#b9d4e7"/><text x="355" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#235f89">Model provider</text><text x="355" y="226" text-anchor="middle" font-size="13" fill="#526d80">TransformerConfig</text>
    <rect x="510" y="172" width="190" height="74" rx="6" fill="#eaf3fa" stroke="#b9d4e7"/><text x="605" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#235f89">Parallel modules</text><text x="605" y="226" text-anchor="middle" font-size="13" fill="#526d80">TP · PP · CP · EP</text>
    <rect x="760" y="172" width="250" height="74" rx="6" fill="#eaf3fa" stroke="#b9d4e7"/><text x="885" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#235f89">Megatron schedules</text><text x="885" y="226" text-anchor="middle" font-size="13" fill="#526d80">optimizer · distributed ckpt</text>
    <path d="M452 209H498M702 209H748" stroke="#286fa3" stroke-width="4" marker-end="url(#blue-arrow)"/>

    <text x="88" y="344" font-size="21" font-weight="800" fill="#a85d20">DeepSpeed</text><text x="88" y="372" font-size="13" fill="#607083">runtime owns</text><text x="88" y="392" font-size="13" fill="#607083">training state</text>
    <rect x="260" y="332" width="190" height="74" rx="6" fill="#f5f7f9" stroke="#d8e2ec"/><text x="355" y="362" text-anchor="middle" font-size="15" font-weight="800" fill="#334154">PyTorch / HF model</text><text x="355" y="386" text-anchor="middle" font-size="13" fill="#607083">optimizer · dataloader</text>
    <rect x="510" y="332" width="190" height="74" rx="6" fill="#fff3e8" stroke="#ebc79f"/><text x="605" y="362" text-anchor="middle" font-size="15" font-weight="800" fill="#985518">initialize + JSON</text><text x="605" y="386" text-anchor="middle" font-size="13" fill="#775a3e">ZeRO · precision · batch</text>
    <rect x="760" y="332" width="250" height="74" rx="6" fill="#fff3e8" stroke="#ebc79f"/><text x="885" y="362" text-anchor="middle" font-size="15" font-weight="800" fill="#985518">DeepSpeed Engine</text><text x="885" y="386" text-anchor="middle" font-size="13" fill="#775a3e">backward · step · checkpoint</text>
    <path d="M452 369H498M702 369H748" stroke="#c57a27" stroke-width="4" marker-end="url(#orange-arrow)"/>

    <text x="88" y="504" font-size="21" font-weight="800" fill="#258267">Colossal-AI</text><text x="88" y="532" font-size="13" fill="#607083">plugin selects</text><text x="88" y="552" font-size="13" fill="#607083">model transformation</text>
    <rect x="260" y="492" width="190" height="74" rx="6" fill="#f5f7f9" stroke="#d8e2ec"/><text x="355" y="522" text-anchor="middle" font-size="15" font-weight="800" fill="#334154">PyTorch / HF model</text><text x="355" y="546" text-anchor="middle" font-size="13" fill="#607083">training components</text>
    <rect x="510" y="492" width="190" height="74" rx="6" fill="#edf8f2" stroke="#bdddcf"/><text x="605" y="522" text-anchor="middle" font-size="15" font-weight="800" fill="#21664e">Booster + Plugin</text><text x="605" y="546" text-anchor="middle" font-size="13" fill="#476b5c">Gemini · hybrid · FSDP</text>
    <rect x="760" y="492" width="250" height="74" rx="6" fill="#edf8f2" stroke="#bdddcf"/><text x="885" y="522" text-anchor="middle" font-size="15" font-weight="800" fill="#21664e">Boosted components</text><text x="885" y="546" text-anchor="middle" font-size="13" fill="#476b5c">ShardFormer · pipeline · ckpt</text>
    <path d="M452 529H498M702 529H748" stroke="#258267" stroke-width="4" marker-end="url(#green-arrow)"/>
  </g>
  <rect x="140" y="634" width="900" height="42" rx="6" fill="#172033"/>
  <text x="590" y="661" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">The more a framework owns, the more carefully integrations must define boundaries</text>
</svg>
