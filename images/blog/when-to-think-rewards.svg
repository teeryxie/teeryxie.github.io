<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Six trajectory rewards</title><desc id="desc">Six rewards jointly constrain answer correctness, protocol, residual latency, update timing, thought quality, and chain consistency.</desc><rect width="1200" height="700" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">A trajectory is only good when six constraints agree</text><text x="62" y="106" font-size="16" fill="#617083">Single-objective optimization creates predictable controller collapse</text><g font-size="14"><rect x="62" y="154" width="334" height="116" rx="8" fill="#e8f5ef" stroke="#60a48d"/><text x="88" y="190" font-size="18" font-weight="700" fill="#28785e">Rₐ · Answer</text><text x="88" y="220" fill="#41695b">Correct final task output</text><text x="88" y="246" fill="#41695b">Rule score; judge only as fallback</text><rect x="433" y="154" width="334" height="116" rx="8" fill="#f7e9e7" stroke="#c9857e"/><text x="459" y="190" font-size="18" font-weight="700" fill="#a04a44">R<tspan baseline-shift="sub" font-size="12">f</tspan> · Format gate</text><text x="459" y="220" fill="#754d49">Legal WAIT / THINK / ANSWER</text><text x="459" y="246" fill="#754d49">Invalid protocol blocks all gains</text><rect x="804" y="154" width="334" height="116" rx="8" fill="#fff1dc" stroke="#d0a269"/><text x="830" y="190" font-size="18" font-weight="700" fill="#73532f">R<tspan baseline-shift="sub" font-size="12">s</tspan> · Sync / latency</text><text x="830" y="220" fill="#73532f">Short post-endpoint final think</text><text x="830" y="246" fill="#73532f">6-token free budget</text><rect x="62" y="300" width="334" height="116" rx="8" fill="#e8f1f9" stroke="#7ba1c2"/><text x="88" y="336" font-size="18" font-weight="700" fill="#2f6e9f">R<tspan baseline-shift="sub" font-size="12">u</tspan> · Update timing ×3</text><text x="88" y="366" fill="#516375">Think near evidence changes</text><text x="88" y="392" fill="#516375">Penalize missed and dense updates</text><rect x="433" y="300" width="334" height="116" rx="8" fill="#f2eafb" stroke="#9b7bbb"/><text x="459" y="336" font-size="18" font-weight="700" fill="#72509a">R<tspan baseline-shift="sub" font-size="12">t</tspan> · Thought quality</text><text x="459" y="366" fill="#665477">Short, concrete, answer-supporting</text><text x="459" y="392" fill="#665477">Local Qwen judge: 0 / .5 / 1</text><rect x="804" y="300" width="334" height="116" rx="8" fill="#f2eafb" stroke="#9b7bbb"/><text x="830" y="336" font-size="18" font-weight="700" fill="#72509a">R<tspan baseline-shift="sub" font-size="12">c</tspan> · Chain consistency</text><text x="830" y="366" fill="#665477">Thoughts support a correct answer</text><text x="830" y="392" fill="#665477">Enabled only when Rₐ &gt; 0</text></g><rect x="62" y="466" width="1076" height="86" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="88" y="500" font-size="15" font-weight="700" fill="#203247">R = Rₐ + R<tspan baseline-shift="sub" font-size="11">f</tspan> + R<tspan baseline-shift="sub" font-size="11">s</tspan> + 3R<tspan baseline-shift="sub" font-size="11">u</tspan> + R<tspan baseline-shift="sub" font-size="11">t</tspan> + 0.45 · 1[Rₐ &gt; 0] · RₐR<tspan baseline-shift="sub" font-size="11">c</tspan></text><text x="88" y="530" font-size="13" fill="#617083">Protocol invalid → only format penalty remains; a correct answer cannot rescue a malformed or premature trajectory.</text><g font-size="13"><rect x="62" y="590" width="330" height="52" rx="6" fill="#f7e9e7"/><text x="86" y="622" fill="#a04a44">Answer-only → WAIT ALL</text><rect x="435" y="590" width="330" height="52" rx="6" fill="#f7e9e7"/><text x="464" y="622" fill="#a04a44">Latency-only → EMPTY THINK</text><rect x="808" y="590" width="330" height="52" rx="6" fill="#f7e9e7"/><text x="838" y="622" fill="#a04a44">Update-only → THINK EVERY TICK</text></g></g></svg>
