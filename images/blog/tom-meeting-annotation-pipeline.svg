<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MeetingToM annotation pipeline</title><desc id="desc">Candidate mining, GPT drafting, human labeling, adjudication and filtering.</desc><rect width="1200" height="620" fill="#f4f7fa"/><text x="62" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#203247">How a MeetingToM label is constructed</text><text x="62" y="106" font-family="Arial,sans-serif" font-size="16" fill="#617083">Automation proposes the task; people determine the evidence-grounded gold</text>
  <g font-family="Arial,sans-serif"><g fill="#fff" stroke="#bcc9d6"><rect x="62" y="162" width="190" height="150" rx="8"/><rect x="284" y="162" width="190" height="150" rx="8"/><rect x="506" y="162" width="190" height="150" rx="8"/><rect x="728" y="162" width="190" height="150" rx="8"/><rect x="950" y="162" width="188" height="150" rx="8"/></g>
    <g font-size="18" font-weight="700" fill="#203247"><text x="88" y="205">1. Candidate mining</text><text x="310" y="205">2. GPT-5 draft</text><text x="532" y="205">3. Independent label</text><text x="754" y="205">4. Adjudication</text><text x="976" y="205">5. Quality gate</text></g>
    <g font-size="14" fill="#536477"><text x="88" y="240">speaker/listener windows</text><text x="88" y="266">“you” anchors</text><text x="88" y="292">decision timestamps</text><text x="310" y="240">candidate questions</text><text x="310" y="266">answer options</text><text x="310" y="292">not the gold label</text><text x="532" y="240">two trained annotators</text><text x="532" y="266">original video + transcript</text><text x="532" y="292">at least two cues in Task 1</text><text x="754" y="240">third annotator</text><text x="754" y="266">majority vote</text><text x="754" y="292">joint verification</text><text x="976" y="240">remove weak evidence</text><text x="976" y="266">remove misalignment</text><text x="976" y="292">remove unresolved cases</text></g>
    <g fill="none" stroke="#70869b" stroke-width="2"><path d="M252 237h32"/><path d="M474 237h32"/><path d="M696 237h32"/><path d="M918 237h32"/></g><g fill="#70869b"><path d="M280 232l8 5-8 5z"/><path d="M502 232l8 5-8 5z"/><path d="M724 232l8 5-8 5z"/><path d="M946 232l8 5-8 5z"/></g>
    <rect x="62" y="360" width="1076" height="184" rx="8" fill="#fff" stroke="#bcc9d6"/><text x="88" y="402" font-size="16" font-weight="700" fill="#2d6d9f">Evidence protocol</text><text x="88" y="436" font-size="15" fill="#35475a">1. Read topic flow in the full corner view</text><text x="88" y="466" font-size="15" fill="#35475a">2. Inspect the target window with close-up as primary evidence</text><text x="88" y="496" font-size="15" fill="#35475a">3. Evidence priority: visual cues &gt; transcript &gt; inference</text><text x="610" y="436" font-size="15" fill="#35475a">4. Label episode-bound dominant state</text><text x="610" y="466" font-size="15" fill="#35475a">5. Do not infer personality or long-term preference</text><text x="610" y="496" font-size="15" fill="#35475a">6. Gold = observer consensus, not private mental truth</text>
  </g>
</svg>
