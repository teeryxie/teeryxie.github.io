<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">DataFlow-Harness system overview</title>
  <desc id="desc">Natural language and visual edits flow through skills, MCP typed mutations, validation, and a shared pipeline backend.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#66727c"/></marker></defs>
  <rect width="1200" height="690" fill="#f7f8fa"/>
  <text x="70" y="68" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17212b">DataFlow-Harness closes the NL2Pipeline gap</text>
  <text x="70" y="104" font-family="Arial, sans-serif" font-size="16" fill="#5e6871">Agents edit a live platform artifact through grounded, typed, validated mutations instead of emitting disposable scripts.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="170" width="235" height="155" rx="8" fill="#fff" stroke="#7b91a5"/>
    <text x="98" y="212" font-size="20" font-weight="700" fill="#30465a">Conversational Agent</text>
    <text x="98" y="253" font-size="16" fill="#536575">natural-language intent</text>
    <text x="98" y="287" font-size="16" fill="#536575">incremental revision</text>

    <rect x="70" y="400" width="235" height="155" rx="8" fill="#fff" stroke="#a17eaf"/>
    <text x="98" y="442" font-size="20" font-weight="700" fill="#694875">Visual DAG Editor</text>
    <text x="98" y="483" font-size="16" fill="#67566e">inspect and edit nodes</text>
    <text x="98" y="517" font-size="16" fill="#67566e">parameters and edges</text>

    <rect x="405" y="145" width="300" height="130" rx="8" fill="#fff" stroke="#d0a043"/>
    <text x="435" y="187" font-size="20" font-weight="700" fill="#7c5a17">DataFlow-Skills</text>
    <text x="435" y="226" font-size="16" fill="#655735">procedural blueprints</text>
    <text x="435" y="254" font-size="16" fill="#655735">composition constraints</text>

    <rect x="405" y="330" width="300" height="225" rx="8" fill="#fff" stroke="#2d8f82" stroke-width="2"/>
    <text x="435" y="373" font-size="20" font-weight="700" fill="#00695c">MCP Tools Layer</text>
    <rect x="435" y="398" width="240" height="42" rx="5" fill="#edf7f5"/>
    <text x="460" y="425" font-size="15" fill="#315f58">1 · Request latest state</text>
    <rect x="435" y="450" width="240" height="42" rx="5" fill="#edf7f5"/>
    <text x="460" y="477" font-size="15" fill="#315f58">2 · Typed mutation</text>
    <rect x="435" y="502" width="240" height="42" rx="5" fill="#edf7f5"/>
    <text x="460" y="529" font-size="15" fill="#315f58">3 · Validate and commit</text>

    <rect x="825" y="185" width="305" height="370" rx="8" fill="#fff" stroke="#d1495b" stroke-width="2"/>
    <text x="856" y="230" font-size="21" font-weight="700" fill="#aa2c40">Pipeline Backend</text>
    <text x="856" y="266" font-size="14" fill="#7b4850">AUTHORITATIVE STATE</text>
    <rect x="856" y="294" width="242" height="62" rx="5" fill="#fff1f3"/>
    <text x="880" y="332" font-size="16" fill="#7b3541">D · data sources</text>
    <rect x="856" y="367" width="242" height="62" rx="5" fill="#fff1f3"/>
    <text x="880" y="405" font-size="16" fill="#7b3541">O + E · operators and edges</text>
    <rect x="856" y="440" width="242" height="62" rx="5" fill="#fff1f3"/>
    <text x="880" y="478" font-size="16" fill="#7b3541">S + R · schema and runtime</text>
    <text x="856" y="532" font-size="14" fill="#765b60">persistent · editable · reusable</text>
  </g>
  <g fill="none" stroke="#66727c" stroke-width="3" marker-end="url(#arrow)">
    <path d="M305 245H392"/>
    <path d="M305 477H392"/>
    <path d="M555 275V318"/>
    <path d="M705 445H812"/>
    <path d="M825 525C760 625 355 625 245 570"/>
  </g>
  <rect x="70" y="610" width="1060" height="45" rx="6" fill="#202b34"/>
  <text x="98" y="639" font-family="Arial, sans-serif" font-size="16" fill="#fff">Structural validation: acyclic graph + adjacent schema compatibility. Semantic correctness and data quality remain separate gates.</text>
</svg>
