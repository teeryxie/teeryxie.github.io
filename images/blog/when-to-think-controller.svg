<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Wait-think-answer streaming controller</title><desc id="desc">The controller reads full audio prefixes and visible thought memory, chooses wait or think before the endpoint, and emits a final think and answer afterward.</desc><rect width="1200" height="690" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">Wait–Think–Answer as online control</text><text x="62" y="106" font-size="16" fill="#617083">Before the known endpoint, the learned choice is WAIT vs THINK; ANSWER is fixed after completion</text><text x="62" y="178" font-size="14" font-weight="700" fill="#3e5063">AUDIO PREFIX</text><rect x="196" y="145" width="875" height="64" rx="7" fill="#e8f1f9" stroke="#7ba1c2"/><path d="M220 178l24-16 24 31 24-43 24 40 24-22 24 9 24-31 24 48 24-28 24 16 24-38 24 42 24-26 24 19 24-34 24 45 24-31 24 22 24-15 24 7 24-28 24 37 24-22 24 13 24-19 24 30 24-20 24 9 24-8 24 3" fill="none" stroke="#3d79a8" stroke-width="2"/><line x1="842" y1="131" x2="842" y2="572" stroke="#b55a52" stroke-width="2" stroke-dasharray="7 5"/><text x="810" y="125" font-size="13" font-weight="700" fill="#a04a44">ENDPOINT</text><text x="62" y="286" font-size="14" font-weight="700" fill="#3e5063">DECISIONS</text><g font-size="13" font-weight="700"><rect x="196" y="250" width="112" height="60" rx="6" fill="#eef3f7"/><text x="227" y="285" fill="#415568">WAIT</text><rect x="330" y="250" width="138" height="60" rx="6" fill="#e8f5ef"/><text x="363" y="285" fill="#28785e">THINK z1</text><rect x="490" y="250" width="112" height="60" rx="6" fill="#eef3f7"/><text x="521" y="285" fill="#415568">WAIT</text><rect x="624" y="250" width="138" height="60" rx="6" fill="#e8f5ef"/><text x="657" y="285" fill="#28785e">THINK z2</text><rect x="874" y="250" width="158" height="60" rx="6" fill="#f2eafb"/><text x="901" y="285" fill="#72509a">FINAL THINK</text></g><text x="62" y="397" font-size="14" font-weight="700" fill="#3e5063">VISIBLE MEMORY</text><rect x="196" y="352" width="646" height="90" rx="7" fill="#fff" stroke="#60a48d"/><text x="222" y="385" font-size="14" fill="#41695b">z1: initial quantity = 12</text><text x="222" y="416" font-size="14" fill="#41695b">z2: remaining = 8; added = 4; total = 12</text><path d="M842 397h32" stroke="#70869b" stroke-width="2"/><rect x="874" y="352" width="228" height="90" rx="7" fill="#f2eafb"/><text x="900" y="385" font-size="14" font-weight="700" fill="#72509a">answer cue = 12</text><text x="900" y="416" font-size="13" fill="#665477">post-endpoint residual</text><text x="62" y="520" font-size="14" font-weight="700" fill="#3e5063">OUTPUT</text><rect x="874" y="484" width="228" height="70" rx="7" fill="#e8f5ef" stroke="#60a48d"/><text x="930" y="526" font-size="16" font-weight="700" fill="#28785e">ANSWER: 12</text><rect x="196" y="484" width="566" height="70" rx="7" fill="#fff1dc"/><text x="224" y="515" font-size="14" font-weight="700" fill="#73532f">Important boundary</text><text x="224" y="539" font-size="13" fill="#73532f">The paper does not allow an early ANSWER before the endpoint.</text><text x="62" y="624" font-size="13" fill="#617083">At each tick: observation = complete audio prefix + previously committed visible thoughts.</text></g></svg>
