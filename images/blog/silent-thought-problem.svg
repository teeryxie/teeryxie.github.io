<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to use listening-time computation</title><desc id="desc">Comparison of silence tokens, explicit chain of thought, and recurrent latent reasoning while a user speaks.</desc>
  <rect width="1200" height="700" fill="#f4f7fa"/><g font-family="Arial,sans-serif"><text x="62" y="72" font-size="30" font-weight="700" fill="#203247">What should a full-duplex model do while listening?</text><text x="62" y="106" font-size="16" fill="#617083">The same streaming frames can carry placeholders, explicit text, or a continuously updated latent state</text>
  <g transform="translate(62 160)"><rect width="330" height="420" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="24" y="46" font-size="19" font-weight="700" fill="#203247">A. Silence / padding</text><text x="24" y="75" font-size="14" fill="#617083">Synchronized but information-poor feedback</text><path d="M35 142h258" stroke="#8da0b2" stroke-width="3"/><g fill="#e7edf2" stroke="#b8c5d1"><rect x="35" y="116" width="48" height="52" rx="6"/><rect x="93" y="116" width="48" height="52" rx="6"/><rect x="151" y="116" width="48" height="52" rx="6"/><rect x="209" y="116" width="48" height="52" rx="6"/></g><g font-size="12" fill="#516375"><text x="45" y="147">SIL</text><text x="103" y="147">SIL</text><text x="161" y="147">SIL</text><text x="219" y="147">SIL</text></g><text x="24" y="230" font-size="14" fill="#3e5063">User audio keeps arriving</text><text x="24" y="261" font-size="14" fill="#3e5063">but the autoregressive channel</text><text x="24" y="292" font-size="14" fill="#3e5063">repeats the same placeholder.</text><rect x="24" y="338" width="282" height="54" rx="6" fill="#f7e9e7"/><text x="45" y="371" font-size="14" font-weight="700" fill="#a04a44">Paid compute, weak state accumulation</text></g>
  <g transform="translate(435 160)"><rect width="330" height="420" rx="8" fill="#fff" stroke="#b9c8d8"/><text x="24" y="46" font-size="19" font-weight="700" fill="#203247">B. Explicit streaming CoT</text><text x="24" y="75" font-size="14" fill="#617083">Readable, but difficult to revise and preempt</text><g font-size="13"><rect x="24" y="112" width="282" height="50" rx="6" fill="#fff1dc"/><text x="42" y="142" fill="#73532f">“Likely wants a train ticket...”</text><rect x="24" y="178" width="282" height="50" rx="6" fill="#fff1dc"/><text x="42" y="208" fill="#73532f">“Date is tomorrow...”</text><rect x="24" y="244" width="282" height="50" rx="6" fill="#f7e9e7" stroke="#c9857e"/><text x="42" y="274" fill="#a04a44">User: “No, the day after.”</text></g><path d="M166 304v38" stroke="#b55a52" stroke-width="2"/><path d="M160 336l6 10 6-10z" fill="#b55a52"/><text x="24" y="372" font-size="14" font-weight="700" fill="#a04a44">Rollback discrete tokens?</text><text x="24" y="397" font-size="13" fill="#617083">Turn may end before the thought chain does.</text></g>
  <g transform="translate(808 160)"><rect width="330" height="420" rx="8" fill="#fff" stroke="#60a48d" stroke-width="2"/><text x="24" y="46" font-size="19" font-weight="700" fill="#203247">C. FLAIR latent state</text><text x="24" y="75" font-size="14" fill="#617083">Soft embeddings evolve with each audio frame</text><g fill="#e8f5ef" stroke="#60a48d"><circle cx="55" cy="142" r="25"/><circle cx="128" cy="142" r="31"/><circle cx="211" cy="142" r="37"/><circle cx="285" cy="142" r="25"/></g><path d="M80 142h17M159 142h15M248 142h12" stroke="#35896f" stroke-width="3"/><g font-size="13" font-weight="700" fill="#28785e"><text x="45" y="147">z1</text><text x="117" y="147">z2</text><text x="200" y="147">z3</text><text x="274" y="147">z4</text></g><text x="24" y="224" font-size="14" fill="#3e5063">No visible thought tokens.</text><text x="24" y="255" font-size="14" fill="#3e5063">New evidence updates the next state.</text><text x="24" y="286" font-size="14" fill="#3e5063">The model can switch to speaking</text><text x="24" y="317" font-size="14" fill="#3e5063">at any predicted boundary.</text><rect x="24" y="338" width="282" height="54" rx="6" fill="#e8f5ef"/><text x="49" y="371" font-size="14" font-weight="700" fill="#28785e">Causal, recurrent, and preemptible</text></g>
  <text x="62" y="635" font-size="14" fill="#617083">FLAIR's claim is functional: better use of listening-time computation. It does not establish human-like or interpretable cognition.</text></g>
</svg>
