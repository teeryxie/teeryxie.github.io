<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog | Tianyu Xie</title>
  <meta name="description" content="Blog posts and research notes by Tianyu Xie.">
  <link rel="icon" href="/images/profile.png">
  <link rel="stylesheet" href="/site.css">
  <script src="/blog/blog-data.js" defer></script>
  <script src="/blog/markdown.js" defer></script>
</head>
<body class="blog-index">
  <header class="masthead">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="/">Tianyu Xie <small>谢天宇</small></a>
      <div class="links">
        <a href="/publications/">Publications</a>
        <a href="/projects/">Projects</a>
        <a class="active" aria-current="page" href="/blog/">Blog</a>
        <a href="/cv/">CV</a>
      </div>
    </nav>
  </header>

  <main class="shell blog-shell">
    <aside class="sidebar blog-author-rail">
      <section class="profile-card blog-author">
        <img class="avatar" src="/images/profile.png" alt="Tianyu Xie profile photo">
        <div class="blog-author-copy">
          <h2 class="name">Tianyu Xie <span lang="zh-CN">/ 谢天宇</span></h2>
          <p class="bio">Research notes, paper readings, surveys, and project logs.</p>
        </div>
      </section>
    </aside>

    <article class="content">
      <h1 class="page-title">Blog</h1>
      <p class="lead">Research notes, paper readings, surveys, publications, and project logs.</p>
      <form class="blog-search" role="search" data-blog-search>
        <label for="blog-search-input">搜索文章</label>
        <span class="blog-search-icon" aria-hidden="true"></span>
        <input id="blog-search-input" type="search" name="q" autocomplete="off" placeholder="搜索标题、摘要或标签">
        <button class="blog-search-clear" type="button" data-search-clear aria-label="清空搜索" title="清空搜索" hidden>×</button>
      </form>
      <div class="blog-filter" data-blog-filter aria-label="Blog category filters">
        <button class="active" type="button" data-section="all" aria-pressed="true">All <span>24</span></button>
        <button type="button" data-section="Research Notes" aria-pressed="false">Research Notes <span>9</span></button>
        <button type="button" data-section="Surveys" aria-pressed="false">Surveys <span>6</span></button>
        <button type="button" data-section="Paper Readings" aria-pressed="false">Paper Readings <span>4</span></button>
        <button type="button" data-section="Publications" aria-pressed="false">Publications <span>4</span></button>
        <button type="button" data-section="Logs" aria-pressed="false">Logs <span>1</span></button>
      </div>
      <div class="blog-results-bar">
        <p data-blog-result-count aria-live="polite">24 篇文章</p>
        <button type="button" data-blog-reset hidden>重置筛选</button>
      </div>
      <div class="blog-list" data-blog-list aria-busy="true">
      </div>
      <div class="blog-empty" data-blog-empty hidden>
        <strong>没有找到匹配的文章</strong>
        <p>可以尝试更短的关键词，或重置当前筛选。</p>
        <button type="button" data-blog-reset>清除全部条件</button>
      </div>
    </article>
  </main>

  <footer class="footer"><div class="footer-inner">© 2026 Tianyu Xie.</div></footer>
</body>
</html>
