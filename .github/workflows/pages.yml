name: Publish site and refresh Scholar citations

on:
  push:
    branches: [main]
  schedule:
    # Monday 00:20 Asia/Shanghai = Sunday 16:20 UTC.
    # GitHub schedules may start later when busy.
    - cron: '20 16 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Check Scholar matching and cache preservation
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh Scholar publications and citation counts
        if: github.event_name != 'push'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv run --script scripts/update_scholar.py --skip-if-current
          else
            uv run --script scripts/update_scholar.py
          fi
      - name: Save refreshed publications and counts
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- data/citations.json data/publications.json publications/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/citations.json data/publications.json publications/index.html
            git commit -m 'Update Google Scholar publications and citation counts'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Prepare tracked site files
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site --exclude='.github' --exclude='scripts'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
